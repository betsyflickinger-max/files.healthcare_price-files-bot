name: Audit gate dry run

# Nov 9, 2026: site/audit_gate.py on pages already live (changes nothing), to see what the publish gate would hold.

on:
  push:
    branches: [audit-gate]
    paths: [site/audit_gate.py, site/audit_rules.py, .github/workflows/audit-gate-test.yml]
  workflow_dispatch:
    inputs:
      areas:
        description: "comma-separated slugs"
        default: "dfw,houston,st-louis-area,atlanta,denver-metro,oklahoma,florida,rest-of-missouri"

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0 pyarrow==26.0.0
      - run: python -u site/audit_gate.py "${{ inputs.areas || 'dfw,houston,st-louis-area,atlanta,denver-metro,oklahoma,florida,rest-of-missouri' }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

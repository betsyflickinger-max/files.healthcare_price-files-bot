name: Insurer file catalog

# Reads a big insurer's whole index (Anthem's is 11.4 GB) as a stream on this runner (no rented machine) and folds it into
# one entry per distinct network: its files (size, date, link checked), which employers and plans use it, which state its
# providers are in, what changed since last month, and problems for the Price File Watch. Also writes every employer plan
# with the networks it uses. insurers/catalog.py; output R2 bot/catalog/<insurer>/<YYYY-MM>/.

on:
  schedule:
    - cron: "17 9 2 * *"   # the 2nd of each month (insurers post new files around the 1st)
  workflow_dispatch:
    inputs:
      insurer:
        description: "Insurer (anthem, cigna, uhc, aetna, hcsc)"
        default: "anthem"
      cmd:
        description: "build (read the index), allowed (only its out-of-network file links), report or rows"
        default: "build"
      states:
        description: "For report/rows: states, comma separated (blank = all)"
        default: ""

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import ijson; print('ijson backend:', ijson.backend)"
      - if: ${{ (inputs.cmd || 'build') == 'build' }}
        run: python insurers/catalog.py build --insurer "${{ inputs.insurer || 'anthem' }}"
      - if: ${{ inputs.cmd == 'allowed' }}
        run: python insurers/catalog.py allowed --insurer "${{ inputs.insurer }}"
      - if: ${{ inputs.cmd == 'report' || inputs.cmd == 'rows' }}
        run: |
          mkdir -p out
          python insurers/catalog.py report --insurer "${{ inputs.insurer }}" --states "${{ inputs.states }}" | tee out/report.md >> "$GITHUB_STEP_SUMMARY"
          python insurers/catalog.py rows --insurer "${{ inputs.insurer }}" --states "${{ inputs.states }}" > out/rows.csv
          wc -l out/rows.csv
      - if: ${{ inputs.cmd == 'report' || inputs.cmd == 'rows' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ inputs.insurer }}-${{ inputs.cmd }}
          path: out/

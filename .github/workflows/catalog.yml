name: Insurer file catalog

# Reads a big insurer's whole index (Anthem's is 11.4 GB) as a stream on this runner (no rented machine) and folds it into
# one entry per distinct network: its files (size, date, link checked), which employers and plans use it, which state its
# providers are in, what changed since last month, and problems for the Price File Watch. Also writes every employer plan
# with the networks it uses. insurers/catalog.py; output R2 bot/catalog/<insurer>/<YYYY-MM>/.

on:
  schedule:
    - cron: "17 9 2 * *"   # the 2nd of each month (insurers post new files around the 1st)
  workflow_dispatch:
    inputs:
      insurer:
        description: "Insurer (anthem)"
        default: "anthem"

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import ijson; print('ijson backend:', ijson.backend)"
      - run: python insurers/catalog.py build --insurer "${{ inputs.insurer || 'anthem' }}"

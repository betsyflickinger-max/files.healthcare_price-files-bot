name: Backblaze B2 test (write, read back, list)
# Oct 28, 2026: one-time check that the B2 keys work before storage moves there. Writes one small file
# (bot/b2-test.txt), reads it back and lists the bucket. Safe to run any time.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
    steps:
      - run: pip install -q boto3
      - shell: python
        run: |
          import os, re, time, boto3
          g = lambda k: "".join(os.environ.get(k, "").split())
          ep, b = g("B2_ENDPOINT"), g("B2_BUCKET")
          if ep and not ep.startswith("http"):
              ep = "https://" + ep
          print("endpoint:", ep, "| bucket:", b, "| bucket looks like an ID:", bool(re.fullmatch(r"[0-9a-f]{24}", b)))
          host = re.sub(r"^https?://", "", ep).split("/")[0]
          print("endpoint starts with s3.:", host.startswith("s3."), "| bucket name inside endpoint:", b.lower() in ep.lower(),
                "| endpoint has a path after the host:", "/" in re.sub(r"^https?://", "", ep).rstrip("/"))
          m = re.search(r"s3\.([a-z0-9-]+)\.backblazeb2\.com", ep)
          region = m.group(1) if m else "us-east-005"
          print("region:", region)
          s3 = boto3.client("s3", endpoint_url=ep, region_name=region,
                            aws_access_key_id=g("B2_ACCESS_KEY_ID"), aws_secret_access_key=g("B2_SECRET_ACCESS_KEY"))
          body = f"b2 test {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}".encode()
          s3.put_object(Bucket=b, Key="bot/b2-test.txt", Body=body)
          back = s3.get_object(Bucket=b, Key="bot/b2-test.txt")["Body"].read()
          assert back == body, "read-back mismatch"
          print("B2 write + read back: OK")
          for label, kw in (("list whole bucket", {}), ("list bot/", {"Prefix": "bot/"})):
              try:
                  r = s3.list_objects_v2(Bucket=b, MaxKeys=5, **kw)
                  print(f"{label}: OK ({r.get('KeyCount')} shown)")
              except Exception as e:
                  print(f"{label}: FAILED {e}")
          try:
              s3.list_objects(Bucket=b, MaxKeys=5); print("list (older method): OK")
          except Exception as e:
              print(f"list (older method): FAILED {e}")
          # Oct 30: what the R2 -> B2 copy left behind (top-level folders, and the copy machine's logs if it saved them)
          r = s3.list_objects_v2(Bucket=b, Delimiter="/")
          print("top-level folders in B2:", [p["Prefix"] for p in r.get("CommonPrefixes", [])], "| top-level files:", r.get("KeyCount"))
          for p in r.get("CommonPrefixes", [])[:20]:
              q = s3.list_objects_v2(Bucket=b, Prefix=p["Prefix"], MaxKeys=1000)
              print(f"  {p['Prefix']}: {q.get('KeyCount')}{'+' if q.get('IsTruncated') else ''} files in the first page")
          logs = s3.list_objects_v2(Bucket=b, Prefix="bot/migration/logs/").get("Contents", [])
          print("copy logs saved:", [(o["Key"], o["Size"], str(o["LastModified"])) for o in logs])
          for o in logs:
              txt = s3.get_object(Bucket=b, Key=o["Key"])["Body"].read().decode("utf-8", "replace").splitlines()
              print(f"--- {o['Key']} (last 15 lines)"); print("\n".join(x[:300] for x in txt[-15:]))

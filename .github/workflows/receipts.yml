name: Insurer file receipts

# Oct 20, 2026 (Betsy): a receipt for every insurer price file, every month, nationwide: name, link, size, date and
# whether the link answered, from the insurers' own listings and servers. The files are too big to keep (UHC alone
# posts ~94 TB a month); the receipt shows each one existed and what it looked like. insurers/receipts.py.
# Runs on the 7th, after the catalogs (2nd, Aetna 6th) and the deep index check (3rd). Started by the Cloudflare timer.

on:
  schedule:
    - cron: "23 12 7 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month (YYYY-MM); blank = this month"
        default: ""

concurrency:
  group: receipts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 requests==2.32.3 internetarchive==5.0.0
      - run: python insurers/receipts.py ${{ inputs.month && format('--month {0}', inputs.month) || '' }}
      - run: cat reports/receipts/*.md | tail -40 >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - name: Save the summary
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/receipts 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Insurer file receipts $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

name: People covered in Texas (research weights)

# Nov 7, 2026: insurers/people_weights.py. Insured lives from the CMS MLR file in the repo, plus Texas self-funded
# Form 5500 participants from the employer join (reads one small file, bot/employers/<date>/employers.parquet, a few MB).
# Writes reports/people-weights/tx.md and .csv. No rented machines, nothing deployed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: python insurers/people_weights.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/people-weights 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "People covered in Texas $(date -u +%F)"; git pull -q --rebase origin "${GITHUB_REF_NAME}"; git push -q origin HEAD:"${GITHUB_REF_NAME}"; }

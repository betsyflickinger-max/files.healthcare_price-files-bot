name: Inventory + contract end dates for tables we already have

on:
  schedule:
    - cron: "19 */6 * * *"   # every 6 hours; skips finished tables, so once all are done each run takes about a minute
  workflow_dispatch:
    inputs:
      limit:
        description: "Test: only this many tables per area (blank = all)"
        default: ""

concurrency:
  group: inventory-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        scope: [dfw, tx, s7, nc]
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: python insurers/backfill_inventory.py --scope ${{ matrix.scope }} --minutes 320 ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

  report:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - run: python insurers/census_report.py
      - run: python insurers/report_cards.py
      - name: Save the report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/census reports/insurer_report_cards 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Insurer file inventory report $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

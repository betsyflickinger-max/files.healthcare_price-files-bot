name: Crosswalk evidence

# Oct 25, 2026 (Betsy asked): do DFW hospital price files put a CPT and an MS-DRG on the same line? Evidence for the
# CPT -> DRG crosswalk (reference/cpt_drg_anesthesia_crosswalk.csv). site/crosswalk_evidence.py. Reads saved hospital rows in R2.
# Runs on push to the crosswalk-evidence branch (and by hand); the report is committed to that branch, not main.

on:
  push:
    branches: [crosswalk-evidence]
    paths: [site/crosswalk_evidence.py, reference/cpt_drg_anesthesia_crosswalk.csv, .github/workflows/crosswalk-evidence.yml]
  workflow_dispatch:

concurrency:
  group: crosswalk-evidence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      WORK: /mnt/xw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo mkdir -p /mnt/xw && sudo chown $USER /mnt/xw
      - run: pip install boto3==1.35.36 duckdb==1.1.3
      - run: python site/crosswalk_evidence.py
      - run: cat reports/crosswalk-evidence/*/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - name: Commit the report to this branch
        run: |
          git config user.name "price-files-bot"; git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/crosswalk-evidence && git commit -m "Crosswalk evidence report $(date -u +%F)" && git push origin HEAD:${GITHUB_REF_NAME} || echo "nothing to commit"

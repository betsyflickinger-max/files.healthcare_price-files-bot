name: Insurer price files
run-name: ${{ (github.event.schedule == '*/10 * * * *' || inputs.fill) && 'Insurer fill' || 'Insurer full check' }}

on:
  schedule:
    - cron: "47 */6 * * *"   # every 6 hours: full check for new insurer files
    - cron: "*/10 * * * *"   # every 10 minutes: collect finished results and put waiting files on any free machine
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check for new files but rent no machines and change nothing"
        type: boolean
        default: true
      scope:
        description: "Area: dfw (the live DFW tables), tx (all of Texas, data/tx/) or s7 (first national batch: TN, CO, OK, AL, MS, MO, GA, data/s7/) or nc (North Carolina, data/nc/) or ct (Connecticut, data/ct/) or il (Illinois, data/il/) or n5 (NY, CA, VA, DC, FL, WI, data/n5/) or nyhf (Healthfirst NY, data/nyhf/) or ar (Arkansas, data/ar/) or b1 (MD, NM, MT, data/b1/)"
        default: "dfw"
      fill:
        description: "Quick fill only (collect results, start waiting files on free machines; used by finished machines)"
        type: boolean
        default: false
      force:
        description: "Re-read the 'only' networks even if their files haven't changed"
        type: boolean
        default: false
      only:
        description: "Only these networks (slot names from insurers/networks.csv, comma-separated; blank = all)"
        required: false
        default: ""
      scheduled:
        description: "Act as the 6-hourly scheduled check (also checks Texas and the national batch); used by the Cloudflare timer"
        type: boolean
        default: false

# Oct 23, 2026: fills and full checks in separate lines. In one shared line, every new 10-minute fill replaced the waiting
# 6-hourly full check (GitHub keeps only one waiting run per line), so no full check finished from Oct 22 on and newly
# added networks (UMR, Core, Select Plus, Aetna national...) and new monthly files were never put in the queue. Now a full
# check sets a lock in R2 (bot/insurers/full_check.json) and waits for a running fill to end; fills skip while it is set,
# so the two never write the same manifest at once.
concurrency:
  group: insurer-price-files-${{ (github.event.schedule == '*/10 * * * *' || inputs.fill) && 'fill' || 'full' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read   # the full check looks for a running fill before it starts

jobs:
  insurers:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.schedule == '*/10 * * * *' || inputs.fill) && 60 || 240 }}   # Oct 23: full checks of 15,000+ links ran out at 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}   # oversized hospital files on queue machines go to archive.org too
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full check lock (fills wait; a full check waits for a running fill)
        id: gate
        run: |
          if [ "${{ (github.event.schedule == '*/10 * * * *' || inputs.fill) }}" = "true" ]; then
            python - <<'PY'
          import json, os, time, boto3
          E = os.environ
          s3 = boto3.client('s3', endpoint_url=f"https://{''.join(E['R2_ACCOUNT_ID'].split())}.r2.cloudflarestorage.com", region_name='auto',
                            aws_access_key_id=''.join(E['R2_ACCESS_KEY_ID'].split()), aws_secret_access_key=''.join(E['R2_SECRET_ACCESS_KEY'].split()))
          try: at = json.loads(s3.get_object(Bucket=''.join(E['R2_BUCKET'].split()), Key='bot/insurers/full_check.json')['Body'].read())['at']
          except Exception: at = 0
          skip = time.time() - at < 4 * 3600
          print('full check running: this fill skips' if skip else 'no full check running')
          open(E['GITHUB_OUTPUT'], 'a').write(f"skip={'1' if skip else ''}\n")
          PY
          else
            python - <<'PY'
          import json, os, time, boto3
          E = os.environ
          s3 = boto3.client('s3', endpoint_url=f"https://{''.join(E['R2_ACCOUNT_ID'].split())}.r2.cloudflarestorage.com", region_name='auto',
                            aws_access_key_id=''.join(E['R2_ACCESS_KEY_ID'].split()), aws_secret_access_key=''.join(E['R2_SECRET_ACCESS_KEY'].split()))
          s3.put_object(Bucket=''.join(E['R2_BUCKET'].split()), Key='bot/insurers/full_check.json', Body=json.dumps({'at': time.time(), 'run': E.get('GITHUB_RUN_ID')}).encode())
          print('full check lock set')
          PY
            for i in $(seq 1 40); do
              n=$(gh run list -R ${{ github.repository }} -w insurers.yml -s in_progress --json displayTitle,databaseId --jq "[.[] | select(.displayTitle == \"Insurer fill\" and .databaseId != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
              [ "$n" = "0" ] && break
              echo "waiting for a running fill to end ($i)"; sleep 30
            done
          fi
      - name: Check the machines' GitHub token (manual runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.fill
        run: |
          T=$(echo -n "$BOT_GITHUB_TOKEN" | tr -d '[:space:]')
          if [ -z "$T" ]; then echo "::warning::BOT_GITHUB_TOKEN is not set: free machines are filled by the 10-minute pass only."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}/actions/workflows/insurers.yml)
          echo "BOT_GITHUB_TOKEN check: HTTP $code (200 = works)"
          [ "$code" = "200" ] || echo "::warning::BOT_GITHUB_TOKEN did not work (HTTP $code). Check its repository access and the Actions permission."
      - name: Check insurer files
        if: steps.gate.outputs.skip != '1'
        run: |
          ARGS=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          ARGS="$ARGS --scope ${{ inputs.scope || 'dfw' }}"
          [ "${{ github.event.schedule }}" = "*/10 * * * *" ] && ARGS="$ARGS --fill"
          [ "${{ inputs.fill }}" = "true" ] && ARGS="$ARGS --fill"
          if [ -z "$DIGITALOCEAN_TOKEN" ] && [[ "$ARGS" != *--dry-run* ]]; then
            echo "::warning::DIGITALOCEAN_TOKEN is not set, so this run only checks (no machines rented)."
            ARGS="--dry-run"
          fi
          python insurers/bot.py $ARGS
      - name: All of Texas and the first national batch (scheduled runs only; manual runs use the inputs above)
        if: steps.gate.outputs.skip != '1' && (github.event_name == 'schedule' || inputs.fill || inputs.scheduled)
        run: |
          cp out/insurer_summary.md out/insurer_summary_dfw.md
          [ -f out/insurer_alerts.md ] && mv out/insurer_alerts.md out/insurer_alerts_dfw.md
          FILL=""; [ "${{ github.event.schedule }}" = "*/10 * * * *" ] && FILL="--fill"
          [ "${{ inputs.fill }}" = "true" ] && FILL="--fill"
          python insurers/bot.py --scope tx $FILL
          cp out/insurer_summary.md out/insurer_summary_tx.md
          [ -f out/insurer_alerts.md ] && mv out/insurer_alerts.md out/insurer_alerts_tx.md
          python insurers/bot.py --scope s7 $FILL || echo "::warning::first national batch (s7) pass failed"
          python insurers/bot.py --scope nc $FILL || echo "::warning::North Carolina (nc) pass failed"
          python insurers/bot.py --scope ar $FILL || echo "::warning::Arkansas (ar) pass failed"   # Oct 20, 2026: ahead of CT, IL and n5 (Betsy)
          python insurers/bot.py --scope b1 $FILL || echo "::warning::Maryland, New Mexico, Montana (b1) pass failed"   # Oct 22, 2026: batches 1-2 (Betsy)
          python insurers/bot.py --scope la $FILL || echo "::warning::Louisiana (la) pass failed"   # Oct 22, 2026: batch 3 (Betsy)
          python insurers/bot.py --scope b4 $FILL || echo "::warning::Indiana, Kentucky, Ohio (b4) pass failed"   # Oct 22, 2026: batch 4 (Betsy)
          python insurers/bot.py --scope az $FILL || echo "::warning::Arizona (az) pass failed"   # Oct 23, 2026: batch 5 (Betsy)
          python insurers/bot.py --scope c1 $FILL || echo "::warning::Michigan + upper Midwest (c1) pass failed"   # Oct 23, 2026: batches 6-11 in 3 groups (Betsy)
          python insurers/bot.py --scope c2 $FILL || echo "::warning::Highmark states, Northeast, South Carolina (c2) pass failed"   # Oct 23, 2026: batches 6-11 in 3 groups (Betsy)
          python insurers/bot.py --scope c3 $FILL || echo "::warning::West (c3) pass failed"   # Oct 23, 2026: batches 6-11 in 3 groups (Betsy)
          python insurers/bot.py --scope ct $FILL || echo "::warning::Connecticut (ct) pass failed"
          python insurers/bot.py --scope il $FILL || echo "::warning::Illinois (il) pass failed"
          python insurers/bot.py --scope n5 $FILL || echo "::warning::next five states (n5) pass failed"
          python insurers/bot.py --scope nyhf $FILL || echo "::warning::Healthfirst NY (nyhf) pass failed"
          [ -f out/insurer_alerts_tx.md ] && cat out/insurer_alerts_tx.md >> out/insurer_alerts.md || true
          cat out/insurer_summary_tx.md >> "$GITHUB_STEP_SUMMARY"
          cat out/insurer_summary_dfw.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/insurer_alerts_dfw.md ] && cat out/insurer_alerts_dfw.md >> out/insurer_alerts.md || true
      - run: cat out/insurer_summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always() && steps.gate.outputs.skip != '1'
      - name: Open an issue for problems
        if: always() && github.event.schedule != '*/10 * * * *' && !inputs.fill
        run: |
          if [ -f out/insurer_alerts.md ]; then
            gh label create insurer-file-alert --color B22222 --description "Insurer file failed, shrank, or went stale" 2>/dev/null || true
            # Oct 24: an issue body is capped at 65,536 characters (3,291 Geisinger lines broke it); keep the first 60,000
            head -c 60000 out/insurer_alerts.md > out/insurer_alerts_short.md
            [ "$(wc -c < out/insurer_alerts.md)" -gt 60000 ] && printf '\n\n(cut: the full list is in this run'"'"'s summary)\n' >> out/insurer_alerts_short.md
            gh issue create --title "Insurer file problems $(date -u +%F)" --body-file out/insurer_alerts_short.md --label insurer-file-alert
          fi
      - name: Clear the full check lock
        if: always() && !(github.event.schedule == '*/10 * * * *' || inputs.fill)
        run: |
          python - <<'PY'
          import os, boto3
          E = os.environ
          s3 = boto3.client('s3', endpoint_url=f"https://{''.join(E['R2_ACCOUNT_ID'].split())}.r2.cloudflarestorage.com", region_name='auto',
                            aws_access_key_id=''.join(E['R2_ACCESS_KEY_ID'].split()), aws_secret_access_key=''.join(E['R2_SECRET_ACCESS_KEY'].split()))
          s3.delete_object(Bucket=''.join(E['R2_BUCKET'].split()), Key='bot/insurers/full_check.json')
          print('full check lock cleared')
          PY

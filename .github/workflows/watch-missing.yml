name: "Watch: hospitals without a price file"

# Oct 19, 2026 (Betsy). After each daily hospital run: export every hospital without a working price file
# (bot/missing_export.py, read-only), save the list to reports/watch/, and republish /price-file-watch/hospitals/
# (site/missing_hospitals_publish.py) with a link and today's count on the Price File Watch page.
on:
  workflow_run:
    workflows: ["Hospital price files"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the page (yes/no)"
        default: "yes"

permissions:
  contents: write

concurrency:
  group: site-build-v2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Export hospitals without a file
        run: python bot/missing_export.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the hospitals list
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == 'yes' }}
        run: python site/missing_hospitals_publish.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save report to main
        if: always()
        run: |
          git config user.name "price-files-bot"
          git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/watch/ || exit 0
          git commit -m "Watch: missing hospitals $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done

name: "Watch: hospitals without a price file"

# Oct 19, 2026. Exports every hospital without a working price file (bot/missing_export.py), read-only.
on:
  push:
    branches: [main]
    paths: [bot/missing_export.py, .github/workflows/watch-missing.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export hospitals without a file
        run: python bot/missing_export.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save report to main
        if: always()
        run: |
          git config user.name "price-files-bot"
          git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/watch/ || exit 0
          git commit -m "Watch: missing hospitals $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done

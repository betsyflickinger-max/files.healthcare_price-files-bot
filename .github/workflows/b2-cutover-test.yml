name: Backblaze cutover test (storage move)
# Nov 9, 2026: checks the storage calls the bot relies on against Backblaze before the switch (see board/b2_cutover_test.py).
# Writes only under bot/cutover-test/ and removes its own files. Runs on pushes to the b2-cutover branch, or by hand.
on:
  push:
    branches: [b2-cutover]
    paths: [board/b2_cutover_test.py, .github/workflows/b2-cutover-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORAGE_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      STORAGE_REGION: us-east-005
      R2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q boto3 duckdb
      - run: python board/b2_cutover_test.py

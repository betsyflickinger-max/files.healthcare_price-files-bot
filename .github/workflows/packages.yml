name: Procedure packages (facility + doctor)

on:
  schedule:
    - cron: "33 14 12 * *"   # monthly on the 12th, 9:33am Central (after the month's insurer tables are read)
  workflow_dispatch:
    inputs:
      reuse:
        description: "Rebuild from this month's saved price rows (minutes, not hours)"
        type: boolean
        default: false

concurrency:
  group: packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: python packages/build_packages.py ${{ inputs.reuse && '--reuse' || '' }}
      - name: Save the summary
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/packages 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Procedure packages $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

name: copy-peek2 (read-only look at the top-up machine)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Look (read only)
        env:
          DOT: ${{ secrets.DIGITALOCEAN_TOKEN }}
          B2K: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2S: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2B: ${{ secrets.B2_BUCKET }}
        run: |
          pip -q install boto3
          echo "== copy machine activity (DigitalOcean monitoring, last 3h, 15-min averages)"
          ID=$(curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/droplets?tag_name=upfront-copy" | python3 -c "import json,sys; d=json.load(sys.stdin)['droplets']; print(d[0]['id'] if d else '')")
          if [ -n "$ID" ]; then
            E=$(date +%s); S=$((E-10800))
            for m in "bandwidth?interface=public&direction=inbound" "bandwidth?interface=public&direction=outbound" "cpu?"; do
              echo "-- $m"
              curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/monitoring/metrics/droplet/${m}&host_id=$ID&start=$S&end=$E" | python3 -c "
          import json,sys,datetime
          r=json.load(sys.stdin).get('data',{}).get('result',[])
          if not r: print('no data'); sys.exit()
          if len(r)>1:  # cpu: sum non-idle modes per timestamp
              tot={}
              for s in r:
                  for t,v in s['values']:
                      tot.setdefault(t,{})[s['metric'].get('mode')]=float(v)
              pts=sorted(tot.items())
              prev=None
              for t,modes in pts[::15]:
                  print(datetime.datetime.utcfromtimestamp(t).strftime('%H:%M'), {k:round(v) for k,v in modes.items() if k in ('user','system','iowait','idle')})
          else:
              for t,v in r[0]['values'][::15]: print(datetime.datetime.utcfromtimestamp(t).strftime('%H:%M'), round(float(v),1), 'Mbps')"
            done
          fi
          echo "== droplets"
          curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/droplets?per_page=200" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin).get('droplets',[]): print(d['name'], d['status'], d['created_at'], d.get('tags'))"
          python3 - <<'PY'
          import os, boto3, re
          s3 = boto3.client("s3", endpoint_url="https://s3.us-east-005.backblazeb2.com", region_name="us-east-005",
                            aws_access_key_id=os.environ["B2K"], aws_secret_access_key=os.environ["B2S"])
          B = os.environ["B2B"]
          print("== bot/migration/logs (newest 25)")
          objs = []
          for p in s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix="bot/migration/logs/"):
              objs += p.get("Contents", [])
          for o in sorted(objs, key=lambda o: o["LastModified"])[-25:]:
              print(o["LastModified"], o["Size"], o["Key"])
          for k in [o["Key"] for o in objs if o["Key"].endswith(("copy.log", "summary.json")) and o["LastModified"].year == 2026 and o["LastModified"].month == 11 and o["LastModified"].day >= 9]:
              t = s3.get_object(Bucket=B, Key=k)["Body"].read().decode("utf-8", "replace").splitlines()
              print("==", k); print("\n".join(l for l in t[-12:] if not re.search(r"(?i)secret|token|bearer", l)))
          try:
              body = s3.get_object(Bucket=B, Key="bot/migration/logs/copy-setup.log")["Body"].read().decode("utf-8", "replace")
              lines = [l for l in body.splitlines() if not re.search(r"(?i)key|secret|token|bearer", l)]
              print("== copy-setup.log tail"); print("\n".join(lines[-3:]))
          except Exception as e:
              print("no setup log:", e)
          PY

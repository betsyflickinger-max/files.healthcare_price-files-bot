name: copy-peek2 website folder sizes on R2 (read only)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Sizes (read only)
        env:
          R2A: ${{ secrets.R2_ACCOUNT_ID }}
          R2K: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2B: ${{ secrets.R2_BUCKET }}
        run: |
          pip -q install boto3
          cat > s.py <<'PY'
          import os, boto3
          from concurrent.futures import ProcessPoolExecutor
          g = lambda k: "".join(os.environ[k].split())
          def c():
              return boto3.client("s3", endpoint_url=f"https://{g('R2A')}.r2.cloudflarestorage.com", region_name="auto",
                                  aws_access_key_id=g("R2K"), aws_secret_access_key=g("R2S"))
          def subs(p):
              s3, out, n, b = c(), [], 0, 0
              for pg in s3.get_paginator("list_objects_v2").paginate(Bucket=g("R2B"), Prefix=p, Delimiter="/"):
                  out += [x["Prefix"] for x in pg.get("CommonPrefixes", [])]
                  for o in pg.get("Contents", []): n += 1; b += o["Size"]
              return out, n, b
          def total(p):
              s3, n, b = c(), 0, 0
              for pg in s3.get_paginator("list_objects_v2").paginate(Bucket=g("R2B"), Prefix=p):
                  for o in pg.get("Contents", []): n += 1; b += o["Size"]
              return p, n, b
          if __name__ == "__main__":
              top, _, _ = subs("")
              with ProcessPoolExecutor(16) as ex:
                  lv = []
                  for t, (s, n, b) in zip(top, ex.map(subs, top)):
                      lv += s
                  res = list(ex.map(total, lv))
              agg = {}
              for p, n, b in res:
                  k = p.split("/")[0] + "/"
                  if k in ("site/", "control/"): k = "/".join(p.split("/")[:2]) + "/"
                  a = agg.setdefault(k, [0, 0]); a[0] += n; a[1] += b
              for k, (n, b) in sorted(agg.items(), key=lambda x: -x[1][1]):
                  print(f"{b/1e9:10.1f} GB {n:>10,} files  {k}")
          PY
          python3 s.py

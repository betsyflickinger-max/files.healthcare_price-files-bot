name: copy-peek2 small-folder file names (read only)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Names (read only)
        env:
          R2A: ${{ secrets.R2_ACCOUNT_ID }}
          R2K: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2B: ${{ secrets.R2_BUCKET }}
        run: |
          pip -q install boto3
          python3 - <<'PY'
          import os, boto3, re, collections
          g = lambda k: "".join(os.environ[k].split())
          s3 = boto3.client("s3", endpoint_url=f"https://{g('R2A')}.r2.cloudflarestorage.com", region_name="auto",
                            aws_access_key_id=g("R2K"), aws_secret_access_key=g("R2S"))
          for p in ("control/data/", "reference/", "bot/dashboard/", "bot/employers/", "bot/catalog/", "data/utilization/2024/", "pipeline/", "data/names/", "data/2026-09-28/", "data/2026-10-05/nat/"):
              c = collections.Counter()
              for pg in s3.get_paginator("list_objects_v2").paginate(Bucket=g("R2B"), Prefix=p):
                  for o in pg.get("Contents", []):
                      k = o["Key"][len(p):]
                      k = re.sub(r"\d{4}-\d{2}(-\d{2})?", "<D>", k)
                      k = re.sub(r"(by_state/)[^/]+", r"\1<ST>", k)
                      k = re.sub(r"/[^/]+$", "/…", k) if k.count("/") > 1 else k
                      c[k] += 1
              print("==", p, len(c), "names")
              print("; ".join(f"{k}" + (f"×{n}" if n > 1 else "") for k, n in sorted(c.items()))[:3500])
          PY

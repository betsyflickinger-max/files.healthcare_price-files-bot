name: copy-peek2 (read-only look at the top-up machine)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Look (read only)
        env:
          DOT: ${{ secrets.DIGITALOCEAN_TOKEN }}
          B2K: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2S: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2B: ${{ secrets.B2_BUCKET }}
        run: |
          pip -q install boto3
          echo "== droplets"
          curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/droplets?per_page=200" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin).get('droplets',[]): print(d['name'], d['status'], d['created_at'], d.get('tags'))"
          python3 - <<'PY'
          import os, boto3, re
          s3 = boto3.client("s3", endpoint_url="https://s3.us-east-005.backblazeb2.com", region_name="us-east-005",
                            aws_access_key_id=os.environ["B2K"], aws_secret_access_key=os.environ["B2S"])
          B = os.environ["B2B"]
          print("== bot/migration/logs (newest 25)")
          objs = []
          for p in s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix="bot/migration/logs/"):
              objs += p.get("Contents", [])
          for o in sorted(objs, key=lambda o: o["LastModified"])[-25:]:
              print(o["LastModified"], o["Size"], o["Key"])
          try:
              body = s3.get_object(Bucket=B, Key="bot/migration/logs/copy-setup.log")["Body"].read().decode("utf-8", "replace")
              lines = [l for l in body.splitlines() if not re.search(r"(?i)key|secret|token|bearer", l)]
              print("== copy-setup.log tail"); print("\n".join(lines[-40:]))
          except Exception as e:
              print("no setup log:", e)
          PY

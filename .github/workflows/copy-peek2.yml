name: copy-peek2 top-up status (read only)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Look (read only)
        env:
          DOT: ${{ secrets.DIGITALOCEAN_TOKEN }}
          B2K: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2S: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2B: ${{ secrets.B2_BUCKET }}
        run: |
          pip -q install boto3
          echo "== copy machines"
          curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/droplets?tag_name=upfront-copy" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin).get('droplets',[]): print(d['name'], d['status'], d['created_at'])"
          python3 - <<'PY'
          import os, boto3, re
          s3 = boto3.client("s3", endpoint_url="https://s3.us-east-005.backblazeb2.com", region_name="us-east-005",
                            aws_access_key_id=os.environ["B2K"], aws_secret_access_key=os.environ["B2S"])
          B = os.environ["B2B"]
          objs = []
          for p in s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix="bot/migration/logs/"):
              objs += p.get("Contents", [])
          new = [o for o in objs if o["LastModified"].strftime("%Y-%m-%d") >= "2026-11-09" and "topup" in o["Key"] or o["Key"].endswith(("copy.log", "probe1.log"))]
          for o in sorted(new, key=lambda o: o["LastModified"])[-30:]:
              print(o["LastModified"], o["Size"], o["Key"])
          for o in objs:
              k = o["Key"]
              if (k.endswith("summary.json") and "topup" in k) or k.endswith("bot/migration/logs/copy.log"):
                  t = s3.get_object(Bucket=B, Key=k)["Body"].read().decode("utf-8", "replace")
                  print("==", k); print("\n".join(l for l in t.splitlines()[-8:] if not re.search(r"(?i)secret|token", l)))
          PY

name: copy-peek2 website storage reads (read only)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Look (read only)
        env:
          R2A: ${{ secrets.R2_ACCOUNT_ID }}
          R2K: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2B: ${{ secrets.R2_BUCKET }}
        run: |
          pip -q install boto3
          python3 - <<'PY'
          import os, boto3, io, tarfile, re
          g = lambda k: "".join(os.environ[k].split())
          s3 = boto3.client("s3", endpoint_url=f"https://{g('R2A')}.r2.cloudflarestorage.com", region_name="auto",
                            aws_access_key_id=g("R2K"), aws_secret_access_key=g("R2S"))
          B = g("R2B")
          o = s3.get_object(Bucket=B, Key="site/deploy/current.tgz")
          print("deploy archive", o["LastModified"], o["ContentLength"])
          t = tarfile.open(fileobj=io.BytesIO(o["Body"].read()))
          hits = {}
          for m in t.getmembers():
              if not m.isfile() or not re.search(r"\.(js|ts|mjs)$", m.name) or "functions" not in m.name: continue
              src = t.extractfile(m).read().decode("utf-8", "replace")
              if "PF" not in src: continue
              uses = sorted(set(re.findall(r"env\.PF\.(\w+)\(\s*([^,)]{0,90})", src)))
              consts = sorted(set(re.findall(r"const\s+(PREFIX|PFX|\w*KEY\w*|\w*PRE\w*)\s*=\s*([^;\n]{0,90})", src)))
              key = (tuple(uses), tuple(consts))
              hits.setdefault(key, []).append(m.name)
          for (uses, consts), files in sorted(hits.items(), key=lambda x: -len(x[1])):
              print(f"\n{len(files)} files, e.g. {files[0]}")
              for u in uses: print("   PF.", u[0], u[1])
              for c in consts: print("   const", c[0], "=", c[1])
          PY

name: copy-peek2 top-up result (read only)
on:
  push:
    branches: [copy-peek2]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Look (read only)
        env:
          DOT: ${{ secrets.DIGITALOCEAN_TOKEN }}
          B2K: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2S: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2B: ${{ secrets.B2_BUCKET }}
        run: |
          pip -q install boto3
          echo "== copy machines"
          curl -s -H "Authorization: Bearer $DOT" "https://api.digitalocean.com/v2/droplets?tag_name=upfront-copy" | python3 -c "
          import json,sys
          d=json.load(sys.stdin).get('droplets',[]); print(len(d), [x['name'] for x in d])"
          python3 - <<'PY'
          import os, boto3, json
          s3 = boto3.client("s3", endpoint_url="https://s3.us-east-005.backblazeb2.com", region_name="us-east-005",
                            aws_access_key_id=os.environ["B2K"], aws_secret_access_key=os.environ["B2S"])
          B = os.environ["B2B"]
          objs = []
          for p in s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix="bot/migration/logs/topup"):
              objs += p.get("Contents", [])
          print("topup files:", len(objs))
          for o in objs:
              if o["Key"].endswith("summary.json") or o["Key"].endswith(".txt") and "probe" in o["Key"] and o["Size"] < 400:
                  print("==", o["Key"], o["LastModified"]); print(s3.get_object(Bucket=B, Key=o["Key"])["Body"].read().decode()[:600])
          PY

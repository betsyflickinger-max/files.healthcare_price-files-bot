name: Hospital prices for Texas city pages

# Puts each Texas city and metro area's own hospital price files on its Price Finder page (site/hosp_area.py).
# Every run moves the build one step (plan -> parse -> h2 -> publish). Runs hourly on the 20th-28th of each month, after the
# monthly Texas city builds, and by hand. Shares the website build's lock so it never deploys at the same time.

on:
  schedule:
    - cron: "17 * 20-28 * *"
  workflow_dispatch:
    inputs:
      build:
        description: "Build id (blank = hosp-tx-<this month>)"
        default: ""
      scope:
        description: "blank = Texas areas; s7 = the seven state pages (parses hospital files early while state builds run)"
        default: ""

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ inputs.build }}
      HOSP_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3
      - run: |
          [ -z "$BUILD" ] && unset BUILD
          python site/hosp_area.py run | tee -a "$GITHUB_STEP_SUMMARY"

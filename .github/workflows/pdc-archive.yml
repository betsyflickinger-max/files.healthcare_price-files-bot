name: CMS Provider Data Catalog history - save the originals

# Nov 24, 2026 (Betsy OK'd, doctors included from the start): saves CMS's quality-data zips for all ten Provider Data
# Catalog topics, 2019 to now (about 19 GB the first time), untouched, in raw/cms_provider_data/. Monthly after that it
# only adds new releases. Builds no page and deploys nothing. See quality/pdc_archive.py.

on:
  push:
    branches: [main]
    paths: [quality/pdc_archive.py, .github/workflows/pdc-archive.yml]
  schedule:
    - cron: "23 9 6 * *"   # 6th of each month, about 3:23 AM Central
  workflow_dispatch:
    inputs:
      topics:
        description: "Topics, comma-separated (blank = all)"
        default: ""

concurrency:
  group: pdc-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 requests==2.33.0
      - run: sudo mkdir -p /mnt/pdc && sudo chown $USER /mnt/pdc
      - shell: bash -eo pipefail {0}
        run: python quality/pdc_archive.py --work /mnt/pdc --topics "${{ inputs.topics }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        if: always()
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cms-provider-data 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "CMS Provider Data Catalog history $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

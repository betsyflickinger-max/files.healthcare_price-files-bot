name: Texas one-time provider move (Nov 10, 2026)
# Runs site/tx_move.py: moves the providers at Killeen-Temple ZIPs that aren't Census ZIP areas (Baylor Scott & White - Temple)
# from the Small towns page to Killeen-Temple for November and sends just those two pages back to build. dry = print only.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Only print what it would do"
        type: boolean
        default: true
      start:
        description: "Step to start at (3 = after the tables are moved)"
        default: "1"
permissions:
  contents: read
concurrency:
  group: tx-move
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DRY: ${{ inputs.dry && '1' || '' }}
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q boto3==1.35.36 duckdb
      - run: df -h / && python site/tx_move.py

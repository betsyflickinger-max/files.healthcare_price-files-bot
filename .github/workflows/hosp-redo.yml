name: Rebuild hospital-file prices (Nov 7 audit)

# Nov 7, 2026 (Betsy OK'd, $25 cap): site/hosp_redo_now.py marks every published page's hospital files for rebuild with the
# Nov 4 rules; the hourly state-pages.yml rebuilds and republishes the state pages; this job's second step moves the Texas
# metros' build (hosp-tx-2026-10) along until it is republished. One-off; push to branch hosp-rebuild to run.

on:
  push:
    branches: [hosp-rebuild]
    paths: [site/hosp_redo_now.py, .github/workflows/hosp-redo.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
  STORAGE_REGION: ${{ vars.STORAGE_REGION }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - run: python -u site/hosp_redo_now.py | tee -a "$GITHUB_STEP_SUMMARY"
  texas:
    needs: mark
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: site-build-v2
      cancel-in-progress: false
    env:
      BUILD: hosp-tx-2026-10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - name: Move the Texas build along until republished
        run: |
          for i in $(seq 1 90); do
            python -u site/hosp_area.py run
            s=$(python -c "import sys; sys.path.insert(0,'site'); import orchestrate as O; print(O.getj(O.SP+'state.json',{}).get('stage'))")
            echo "pass $i: stage $s"
            [ "$s" = "done" ] && break
            sleep 180
          done

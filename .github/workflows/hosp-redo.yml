name: Rebuild areas' hospital prices (fresh folders) and republish

# Nov 9, 2026: rebuilds the named areas' hospital price files on free GitHub machines, each run into its own folder
# (site/hosp_area.py), then clears the areas' "published" marks so the next page run republishes them through the audit
# gate. Written after the Nov 9 round trip found pages reading per-code files left over from an earlier, different build.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Area slugs, comma separated (e.g. odessa,houston)"
      marks_only:
        description: "yes = skip the rebuild, only republish areas already rebuilt into fresh folders"
        default: "no"

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.a.outputs.areas }}
    steps:
      - id: a
        run: echo "areas=$(python3 -c "import json,sys; print(json.dumps([x.strip() for x in sys.argv[1].split(',') if x.strip()]))" '${{ inputs.areas }}')" >> "$GITHUB_OUTPUT"
  h2:
    needs: list
    if: inputs.marks_only != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        area: ${{ fromJSON(needs.list.outputs.areas) }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
      AREA_IN: ${{ matrix.area }}
      NP: "4"
      MEM: "11GB"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 ijson zstandard
      - run: sudo mkdir -p /d && sudo chown "$USER" /d
      - run: |
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do export "$k=$(printf %s "${!k}" | tr -d '[:space:]')"; done
          export SP="$(python site/hosp_redo.py find "$AREA_IN")"
          echo "hospital build $SP"
          python site/hosp_area.py h2 "$AREA_IN"
          python - <<'PY2'
          import json, os, boto3, sys
          g = lambda k: os.environ[k]
          s3 = boto3.client('s3', endpoint_url=(os.environ.get('STORAGE_ENDPOINT') or f"https://{g('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com"), aws_access_key_id=g('R2_ACCESS_KEY_ID'),
                            aws_secret_access_key=g('R2_SECRET_ACCESS_KEY'), region_name=(os.environ.get('STORAGE_REGION') or 'auto'))
          plan = json.loads(s3.get_object(Bucket=g('R2_BUCKET'), Key=g('SP') + 'areas.json')['Body'].read())
          H = json.loads(s3.get_object(Bucket=g('R2_BUCKET'), Key=plan[g('AREA_IN')]['prefix'] + 'hosp/hosp_index.json')['Body'].read())
          if not H.get('h'): sys.exit('the index does not name a fresh folder: the rebuild did not finish')
          n = s3.list_objects_v2(Bucket=g('R2_BUCKET'), Prefix=H['h']).get('KeyCount', 0)
          print('fresh folder', H['h'], 'with', n, '+ per-code files;', len(H['src']), 'hospital files')
          PY2
  marks:
    needs: [list, h2]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 ijson zstandard requests
      - env:
          AREAS: ${{ inputs.areas }}
        run: python site/hosp_redo.py marks $(echo "$AREAS" | tr ',' ' ')

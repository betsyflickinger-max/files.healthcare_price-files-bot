name: Data accuracy audit (round trip)

# Nov 6, 2026 (Betsy OK'd): Layer 2 of the data accuracy audit. audit/roundtrip.py shares no code with the bot: random price
# lines as the pages carry them, traced back to the hospital's archived original file and to the insurer table for the file the
# page links to. Report committed to reports/audit/<date>/roundtrip.md. Monthly on the 21st, and by hand.

on:
  push:
    branches: [audit]
    paths: [audit/roundtrip.py, .github/workflows/audit-roundtrip.yml]
  schedule:
    - cron: "23 9 21 * *"
  workflow_dispatch:
    inputs:
      insurer:
        description: "insurer lines to sample"
        default: "1000"
      hospital:
        description: "hospital-file lines to sample"
        default: "400"

concurrency:
  group: audit-roundtrip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 zstandard==0.23.0 ijson==3.3.0
      - name: Round trip
        run: |
          set -o pipefail
          python -u audit/roundtrip.py --insurer "${{ inputs.insurer || '1000' }}" --hospital "${{ inputs.hospital || '400' }}" 2>&1 | tee /tmp/rt.log
      - name: Report
        if: always()
        run: |
          D=reports/audit/$(TZ=America/Chicago date +%F); mkdir -p $D; tail -c 200000 /tmp/rt.log > $D/roundtrip.log || true
          [ -f $D/roundtrip.md ] && cat $D/roundtrip.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "price-files-bot"; git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/audit && git commit -m "Data accuracy audit round trip $(TZ=America/Chicago date +%F)" && git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} || echo "nothing to commit"

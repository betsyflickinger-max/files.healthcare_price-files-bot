name: Search fix (Price Finder search, Nov 7 2026)

# Nov 7, 2026 (Betsy's "transabdominal myomectomy" test): deploys the new site/assets/pf-table.js to the live site.
# The site push (site/sitewide.py -> site/pf_table.py) copies pf-table.js into every Price Finder page. Re-running is safe. Rerun 1 (Nov 7): words typed as two ("lower back", "anti reflux"). Rerun 2: search events for the Visitors tab. Rerun 3 (Nov 7 testers): birth bills on Price Finder pages
# (ux_polish PF block, also saved to the R2 page copies future builds start from), DRG pages lose the doctor's-fee row,
# and sitewide adds missing hospital-price routes (San Angelo). Rerun 4: one-area notes, anesthesia note + link. Rerun 5: San Angelo route (hosp/h/ check).
on:
  push:
    branches: [main]
    paths: [.github/workflows/search-fix.yml]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 requests==2.32.3 pillow==10.4.0 pyarrow==26.0.0 duckdb==1.1.3
      - run: |
          python site/site_files.py pull w
          python - <<'PY'
          import glob, sys
          sys.path.insert(0, 'site'); import ux_polish as u
          n = 0
          for p in glob.glob('w/site/**/price-finder/index.html', recursive=True):
              s = open(p, encoding='utf-8').read()
              if u.MARK_PF not in s: continue   # redirect stubs and pages without the polish block
              t = u.patch_pf(s)
              if t != s: open(p, 'w', encoding='utf-8').write(t); n += 1
          print(n, 'Price Finder pages given the new bills section')
          PY
          python site/ux_polish.py --r2
          python site/site_files.py push w
          grep -c "ALIASES:START" w/site/pf-table.js | sed 's/^/pf-table.js with the new search: /' | tee -a "$GITHUB_STEP_SUMMARY"

name: CMS quality history - query-ready tables and hospital trends

# Nov 24, 2026 (Betsy: "pull these into a database"). Turns the CMS zips saved by pdc-archive.yml into tables DuckDB and
# MotherDuck can query in place (reference/cms_provider_data/), then builds the hospital trend tables keyed by CCN.
# Hospitals go first; the other nine topics follow, smallest first. A run that hits its time limit resumes on the next
# run. Builds no page and deploys nothing. See quality/pdc_tables.py.

on:
  push:
    branches: [main]
    paths: [quality/pdc_tables.py, .github/workflows/pdc-tables.yml]
  schedule:
    - cron: "23 15 6 * *"   # 6th of each month, about 9:23 AM Central, after pdc-archive has saved the new releases
  workflow_dispatch:

concurrency:
  group: pdc-tables
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: sudo mkdir -p /mnt/pdc && sudo chown $USER /mnt/pdc
      - name: Hospitals tables
        run: python quality/pdc_tables.py tables --work /mnt/pdc --topics hospitals --minutes 60
      - name: Hospital trend tables
        shell: bash -eo pipefail {0}
        run: python quality/pdc_tables.py trends --work /mnt/pdc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the hospital report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cms-provider-data 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "CMS hospital trend tables $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
      - name: Every other topic
        shell: bash -eo pipefail {0}
        run: python quality/pdc_tables.py tables --work /mnt/pdc --minutes 240 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the reports
        if: always()
        run: |
          git add reports/cms-provider-data 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "CMS quality history tables $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

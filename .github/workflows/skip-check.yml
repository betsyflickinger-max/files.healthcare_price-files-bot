name: Skipped-network check

# Oct 21, 2026 (Betsy: yes): what do the pick lists leave out? insurers/skip_check.py.
#   pick:    choose a sample of left-out networks from the newest catalogs; the network list (artifact) is committed as
#            insurers/networks_skip<area>.csv only after Betsy OKs its GB (machine-rules.md rule 3).
#   compare: after the insurer bot has read the sample (scope skip<area>), compare its prices with the kept networks.

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "pick, queue (check + queue the sample files; run again to collect results) or compare"
        default: "pick"
      area:
        description: "Area whose kept networks are already read (il)"
        default: "il"
      insurers:
        description: "pick: insurers, comma separated"
        default: "uhc,aetna"
      n:
        description: "pick: networks per insurer"
        default: "10"
      insurer:
        description: "compare: only this insurer (UnitedHealthcare or Aetna; blank = both)"
        default: ""
      nets:
        description: "compare: only these sampled networks (comma separated, e.g. pl-3hp,pl-ks; blank = all)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt duckdb==1.5.6
      - if: ${{ inputs.cmd == 'pick' }}
        run: |
          mkdir -p out
          python insurers/skip_check.py pick --area "${{ inputs.area }}" --insurers "${{ inputs.insurers }}" --n "${{ inputs.n }}" > "out/networks_skip${{ inputs.area }}.csv"
      # Oct 21, 2026: run here, not in the 10-minute insurer pass. With Healthfirst's 6,137 files in the queue that pass
      # spends ~50 minutes per area and hits its 60-minute limit before reaching skipil.
      - if: ${{ inputs.cmd == 'queue' || inputs.cmd == 'compare' }}
        run: python insurers/bot.py --scope "skip${{ inputs.area }}"
      # Read-only look at the DigitalOcean account (Oct 22, 2026): why new machines are refused with "exceed your droplet limit".
      - if: ${{ inputs.cmd == 'machines' }}
        run: |
          python - <<'PY'
          import os, requests, collections
          h = {"Authorization": "Bearer " + "".join(os.environ["DIGITALOCEAN_TOKEN"].split())}
          a = requests.get("https://api.digitalocean.com/v2/account", headers=h, timeout=60).json()["account"]
          print("account:", {k: a.get(k) for k in ("droplet_limit", "status", "status_message", "volume_limit")})
          ds = requests.get("https://api.digitalocean.com/v2/droplets", params={"per_page": 200}, headers=h, timeout=60).json()["droplets"]
          print("machines:", len(ds), "vCPUs:", sum(d["vcpus"] for d in ds), "GB memory:", sum(d["memory"] for d in ds) // 1024)
          for d in sorted(ds, key=lambda d: d["created_at"]):
              print(d["created_at"][:16], d["name"], d["size_slug"], d["status"], d["region"]["slug"])
          PY
          python - <<'PY'
          import sys, json, collections; sys.path[:0] = ["insurers", "bot"]
          import store, fleet
          s3, b = store.r2()
          js, cl = fleet.jobs(s3, b), fleet.claims(s3, b)
          print("jobs by scope/mem:", collections.Counter((j["scope"], j.get("mem")) for j in js.values()).most_common(12))
          print("claims:", len(cl)); [print(" ", k, json.dumps(v)[:200]) for k, v in list(cl.items())[:5]]
          print("skipil jobs left:", [(k, j.get("mem"), j.get("size")) for k, j in js.items() if j["scope"] == "skipil"])
          keys = sorted(fleet._keys(s3, b, fleet.L))[-3:]
          for k in keys:
              t = s3.get_object(Bucket=b, Key=k)["Body"].read().decode(errors="replace").splitlines()
              print("==", k); print("\n".join(t[-15:]))
          PY
      # Oct 22, 2026: one-time swap of queue machines started before the queue speed fixes (fleet.py 9129fae, 6da31f7).
      # They keep the old code (~30 min of queue reading per file) until they shut down, which with Healthfirst's
      # 5,100 files waiting is never. Only machines reading nothing are deleted; the next 10-minute pass rents new ones.
      # Oct 23, 2026: find UMR's Choice Plus networks in the UnitedHealthcare catalog (read-only)
      - if: ${{ inputs.cmd == 'umr' }}
        run: |
          python - <<'PY'
          import sys; sys.path[:0] = ["insurers"]
          import catalog
          st = catalog.Store()
          m = st.get("bot/catalog/uhc/latest.json")["month"]
          cat = st.get(f"bot/catalog/uhc/{m}/catalog.json")
          rows = [r for r in cat["networks"] if "umr" in (r.get("description", "") + r["network"] + r.get("reporting_entity", "")).lower()]
          print("UMR networks:", len(rows), "month", m)
          rows.sort(key=lambda r: -(r.get("employers") or 0))
          for r in rows[:60]:
              print(f'{r.get("employers") or 0:>7} emp | {r["gb"]:>6} GB | {r["state"]:>8} | {r["coverage"]} | {r["network"]} | {r.get("description","")[:50]} | parts {r["parts"]} | {"; ".join(r["problems"])}')
          cp = [r for r in cat["networks"] if "choice-plus" in r["network"].lower() or "choice plus" in r["network"].lower()]
          print("\nAll Choice Plus networks:", len(cp))
          for r in sorted(cp, key=lambda r: -(r.get("employers") or 0))[:40]:
              print(f'{r.get("employers") or 0:>7} emp | {r["gb"]:>6} GB | {r["state"]:>8} | {r["network"]} | {r.get("description","")[:50]}')
          PY
      - if: ${{ inputs.cmd == 'sizes' }}
        run: |
          python - <<'PY'
          import sys; sys.path[:0] = ["insurers", "bot"]
          import store
          s3, b = store.r2()
          for pre in ("data/il/rates/", "data/skipil/rates/"):
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=b, Prefix=pre):
                  for o in page.get("Contents", []):
                      if "etna" in o["Key"] or "pl-" in o["Key"]:
                          print(o["Key"], round(o["Size"] / 1e9, 2), "GB")
          PY
      - if: ${{ inputs.cmd == 'recycle' }}
        run: |
          python - <<'PY'
          import sys; sys.path[:0] = ["insurers", "bot"]
          import store, fleet, droplets
          s3, b = store.r2()
          busy = {str(c.get("droplet_id")) for c in fleet.claims(s3, b).values()}
          for did, name, created, size in droplets.fleet():
              if created < "2026-10-22T14:00" and str(did) not in busy:
                  print("delete", name, created, size, droplets.delete(did))
              else:
                  print("keep", name, created, "busy" if str(did) in busy else "new code")
          PY
      # Oct 22, 2026: one step per insurer with its own time limit, so a stalled read can't use up the whole job
      # (the second run sat 4 hours with no output).
      - if: ${{ inputs.cmd == 'compare' && inputs.insurer != 'Aetna' }}
        timeout-minutes: 75
        continue-on-error: true
        run: python insurers/skip_check.py compare --area "${{ inputs.area }}" --insurer UnitedHealthcare
      # Aetna's Illinois tables are ~30 GB each (14 of them, ~420 GB), so its step gets nearly all of the job's 6 hours
      - if: ${{ inputs.cmd == 'compare' && inputs.insurer != 'UnitedHealthcare' }}
        timeout-minutes: 340
        continue-on-error: true
        run: python insurers/skip_check.py compare --area "${{ inputs.area }}" --insurer Aetna --nets "${{ inputs.nets }}"
      - uses: actions/upload-artifact@v4
        with:
          name: skip-check-${{ inputs.cmd }}-${{ inputs.area }}
          path: out/
          if-no-files-found: ignore

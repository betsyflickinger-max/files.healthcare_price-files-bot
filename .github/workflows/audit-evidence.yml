name: Data accuracy audit (evidence packets)

# Nov 6, 2026 (Betsy OK'd): Layer 3 of the data accuracy audit. audit/evidence.py builds 350 evidence packets (300 random price
# lines + 50 risky ones) for a fresh Claude to audit with packets/AUDITOR.md. Committed to reports/audit/<date>/packets/.
# Quarterly (Jan/Apr/Jul/Oct 22nd) and by hand. First run Nov 6, 2026.

on:
  push:
    branches: [audit]
    paths: [audit/evidence.py, .github/workflows/audit-evidence.yml]
  schedule:
    - cron: "29 9 22 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      random: {description: "random price lines", default: "300"}
      risky: {description: "risky lines", default: "50"}
      focus: {description: "area slugs that get 40% of the random lines (comma-separated)", default: ""}

concurrency:
  group: audit-evidence-v3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  packets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 zstandard==0.23.0 ijson==3.3.0 requests==2.33.0
      - name: Packets
        run: |
          set -o pipefail
          python -u audit/evidence.py --random ${{ inputs.random || 300 }} --risky ${{ inputs.risky || 50 }} --focus "${{ inputs.focus }}" 2>&1 | tee /tmp/ev.log
      - name: Commit
        if: always()
        run: |
          D=reports/audit/$(TZ=America/Chicago date +%F); mkdir -p $D; tail -c 200000 /tmp/ev.log > $D/evidence-${{ github.run_id }}.log || true
          git config user.name "price-files-bot"; git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/audit && git commit -m "Data accuracy audit evidence packets $(TZ=America/Chicago date +%F)" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*20)); done || echo "nothing to commit"

name: Match pilot hand-check

# Oct 24, 2026 (Betsy OK'd): pull the original hospital and insurer rows behind the match pilot's biggest disagreements
# (site/match_handcheck.py; cases in reports/match-pilot/<YYYY-MM>/handcheck/cases.json). Output committed next to the cases.

on:
  push:
    branches: [main]
    paths: [site/match_handcheck.py, .github/workflows/match-handcheck.yml, "reports/match-pilot/*/handcheck/cases.json"]
  workflow_dispatch:

concurrency:
  group: match-handcheck
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIR: reports/match-pilot/2026-10/handcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 zstandard==0.23.0
      - run: python site/match_handcheck.py
      - run: cat $DIR/sources.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - name: Commit
        if: always()
        run: |
          git config user.name "price-files-bot"; git config user.email "price-files-bot@users.noreply.github.com"
          git add $DIR && git commit -m "Match pilot hand-check sources $(date -u +%F)" && git pull --rebase -q origin main && git push origin HEAD:main || echo "nothing to commit"

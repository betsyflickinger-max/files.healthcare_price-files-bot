name: Homepage pages only (/v2/, /story/, /folders/)

# Oct 19, 2026: publishes just the homepage variants (site/home_v2.py deploy) without waiting for a full price-page
# rebuild. deploy() re-checks the live site before saving, so it is safe beside a running Procedure pages job.
on:
  workflow_dispatch:

concurrency:
  group: home-pages
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 pillow==10.4.0 pyarrow==26.0.0
      - shell: bash
        run: python site/home_v2.py deploy | tee -a "$GITHUB_STEP_SUMMARY"

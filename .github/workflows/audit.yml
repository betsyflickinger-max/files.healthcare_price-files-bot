name: Data accuracy audit

# Nov 6, 2026 (Betsy OK'd): Layer 1 of the data accuracy audit (Healthcare folder DATA-ACCURACY-AUDIT.md). Read-only on the
# site: rule checks on every area's featured procedures, a link check, and a permanent snapshot of what each page shows
# (storage history/published/<date>/) for change-over-time analysis. Report committed to reports/audit/<date>/.
# Monthly on the 20th (after the monthly builds), and by hand.

on:
  push:
    branches: [audit]
    paths: [site/audit_rules.py, .github/workflows/audit.yml]
  schedule:
    - cron: "17 9 20 * *"
  workflow_dispatch:
    inputs:
      areas:
        description: "only these areas (comma-separated slugs); blank = every area"
        required: false
      all_codes:
        description: "every code, not just the 89 featured (slow)"
        type: boolean
        default: false

concurrency:
  group: audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 pyarrow==26.0.0 duckdb==1.1.3 requests==2.33.0 pillow==10.4.0
      - name: Audit
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.areas }}" ]; then ARGS="$ARGS --areas ${{ inputs.areas }}"; fi
          if [ "${{ inputs.all_codes }}" = "true" ]; then ARGS="$ARGS --all-codes"; fi
          python -u site/audit_rules.py $ARGS 2>&1 | tee /tmp/audit.log
      - name: Report
        if: always()
        run: |
          D=reports/audit/$(TZ=America/Chicago date +%F); mkdir -p $D; tail -c 200000 /tmp/audit.log > $D/run-${{ github.run_id }}.log || true
          [ -f $D/summary.md ] && cat $D/summary.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "price-files-bot"; git config user.email "price-files-bot@users.noreply.github.com"
          git add reports/audit && git commit -m "Data accuracy audit $(TZ=America/Chicago date +%F)" && for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*20)); done || echo "nothing to commit"

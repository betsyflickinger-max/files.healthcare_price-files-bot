name: What's in the insurer files (report)

on:
  schedule:
    - cron: "53 11 * * *"   # daily 6:53am Central; commits only when the month's report changes
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM); blank = this month"
        default: ""

concurrency:
  group: census-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - run: python insurers/census_report.py ${{ inputs.month }}
      - run: python insurers/report_cards.py
      - name: Save the report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/census reports/insurer_report_cards 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Insurer file inventory report $(date -u +%F)"; git pull -q --rebase origin main; git push -q origin HEAD:main; }

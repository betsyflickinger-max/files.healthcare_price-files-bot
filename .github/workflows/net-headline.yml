# Network access headline boxes, one-off (Oct 31, 2026): rebuild net_headline.json from a finished dashboard.yml run's
# files and copy it to R2 control/data/, without waiting for the next daily run. The daily run does this itself.
name: Network headline (one-off)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "dashboard.yml run id to read from"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  headline:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dashboard, path: out/dashboard, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: network, path: out/dashboard, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/checkout@v4
        with: {path: bot, sparse-checkout: board}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python bot/board/net_headline.py out/dashboard
          pip install -q boto3==1.35.36 && python bot/board/to_r2_control.py out/dashboard net_headline.json

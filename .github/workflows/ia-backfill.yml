name: archive.org gap check

# Oct 22, 2026 (Betsy): once a day, compare what we keep in R2 (hospital originals, employer index bundles, insurer
# file receipts) with what archive.org actually holds, send whatever is missing and confirm it arrived.
# bot/ia_backfill.py. Started daily by the Cloudflare timer, after the hospital run.

on:
  schedule:
    - cron: "33 15 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Months (YYYY-MM, comma-separated); blank = this month and last"
        default: ""
      check_only:
        description: "Only report what's missing; send nothing"
        type: boolean
        default: false

concurrency:
  group: ia-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 requests==2.32.3 internetarchive==5.0.0
      - run: |
          ARGS=""
          [ -n "${{ inputs.months }}" ] && ARGS="--months ${{ inputs.months }}"
          [ "${{ inputs.check_only }}" = "true" ] && ARGS="$ARGS --check-only"
          python bot/ia_backfill.py $ARGS
      - run: cat out/ia_gaps.md >> "$GITHUB_STEP_SUMMARY"
        if: always()

name: Storage sizes by folder (Backblaze B2, read only)
# Nov 24, 2026: shows where the stored bytes are, by top folder and by second-level folder.
# Lists only. It never writes, moves or deletes anything in the bucket.
# Counts hidden old versions separately, because Backblaze bills for those too.
on:
  workflow_dispatch:
  push:
    branches: [storage-sizes]
    paths: ['.github/workflows/storage-sizes.yml']
permissions:
  contents: read
jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
    steps:
      - run: pip install -q boto3
      - shell: python
        run: |
          import os, re, time, collections, boto3
          g = lambda k: "".join(os.environ.get(k, "").split())
          ep, b = g("B2_ENDPOINT"), g("B2_BUCKET")
          if ep and not ep.startswith("http"):
              ep = "https://" + ep
          m = re.search(r"s3\.([a-z0-9-]+)\.backblazeb2\.com", ep)
          s3 = boto3.client("s3", endpoint_url=ep, region_name=m.group(1) if m else "us-east-005",
                            aws_access_key_id=g("B2_ACCESS_KEY_ID"), aws_secret_access_key=g("B2_SECRET_ACCESS_KEY"))
          PRICE_PER_TB = 6.95  # Backblaze B2 list price per TB-month (storage-options-oct27.md)
          top = collections.defaultdict(lambda: [0, 0, 0, 0])   # files, bytes, old-version files, old-version bytes
          sub = collections.defaultdict(lambda: [0, 0, 0, 0])
          n, t0, pages = 0, time.time(), 0
          for page in s3.get_paginator("list_object_versions").paginate(Bucket=b, PaginationConfig={"PageSize": 1000}):
              pages += 1
              for o in page.get("Versions", []):
                  parts = o["Key"].split("/")
                  k1 = parts[0] if len(parts) > 1 else "(files at the top level)"
                  k2 = k1 + "/" + (parts[1] if len(parts) > 2 else "(files directly inside)")
                  i = 0 if o.get("IsLatest") else 2
                  for d, k in ((top, k1), (sub, k2)):
                      d[k][i] += 1
                      d[k][i + 1] += o["Size"]
                  n += 1
              if pages % 500 == 0:
                  print(f"{n:,} file versions listed, {int(time.time() - t0)} s", flush=True)
          GB = 1000 ** 3
          def table(d, title, limit=None):
              rows = sorted(d.items(), key=lambda kv: -(kv[1][1] + kv[1][3]))
              total = sum(v[1] + v[3] for v in d.values()) or 1
              out = [f"### {title}", "",
                     "| Folder | Current files | Current GB | Hidden old-version files | Hidden old-version GB | Share of all bytes | About $/month |",
                     "|---|---:|---:|---:|---:|---:|---:|"]
              for k, (f, by, of, oby) in rows[:limit]:
                  out.append(f"| `{k}` | {f:,} | {by / GB:,.1f} | {of:,} | {oby / GB:,.1f} | {100 * (by + oby) / total:.1f}% | {(by + oby) / 1000 ** 4 * PRICE_PER_TB:,.2f} |")
              f, by, of, oby = (sum(v[i] for v in d.values()) for i in range(4))
              out.append(f"| **Total** | {f:,} | {by / GB:,.1f} | {of:,} | {oby / GB:,.1f} | 100% | {(by + oby) / 1000 ** 4 * PRICE_PER_TB:,.2f} |")
              return "\n".join(out) + "\n"
          text = (f"## Backblaze storage by folder ({time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())})\n\n"
                  f"{n:,} file versions listed in {int(time.time() - t0)} s. Read only: nothing was changed.\n"
                  f"Dollar figures use ${PRICE_PER_TB}/TB-month and are estimates, not the bill.\n\n"
                  + table(top, "Top-level folders") + "\n" + table(sub, "Second-level folders (40 largest)", 40))
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(text)

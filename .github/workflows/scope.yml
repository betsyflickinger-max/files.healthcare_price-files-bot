name: Build provider list

on:
  # Oct 20, 2026: also runs when insurers/scope_requests.txt changes, so a new state's provider list can be asked for
  # in a commit (one line per list: "STATES NAME", e.g. "AR ar"). Every line is (re)built on each change.
  push:
    branches: [main]
    paths: [insurers/scope_requests.txt]
  workflow_dispatch:
    inputs:
      state:
        description: "Two-letter state, or several separated by commas (builds every provider practicing there from the federal NPI registry)"
        default: "TX"
      name:
        description: "Name for a several-state list (e.g. s7 for TN,CO,OK,AL,MS,MO,GA); blank = the state"
        required: false
        default: ""

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyarrow==26.0.0
      - if: github.event_name == 'workflow_dispatch'
        run: python insurers/build_scope.py "${{ inputs.state }}" "${{ inputs.name }}"
      - if: github.event_name == 'push'
        run: |
          grep -v '^[[:space:]]*#' insurers/scope_requests.txt | while read -r st nm; do
            [ -z "$st" ] && continue
            echo "building provider list $st -> $nm"
            python insurers/build_scope.py "$st" "$nm" < /dev/null
          done

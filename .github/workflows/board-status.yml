name: Board status (hourly)

on:
  workflow_run:   # GitHub's hourly schedule can lag or skip, so also refresh after each bot run
    workflows: ["Insurer price files", "Hospital price files"]
    types: [completed]
  schedule:
    - cron: "15 * * * *"   # every hour at :15; the Claude board update runs at :29
  workflow_dispatch:

concurrency:
  group: board-status
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3==1.35.36
      - run: python board/status.py
      - name: Publish to the private repo (branch board-status)
        env:
          DATA_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          [ -n "$DATA_TOKEN" ] || { echo "::error::DASHBOARD_DATA_TOKEN is not set"; exit 1; }
          cd out/board
          git init -q -b board-status
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Board status $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${DATA_TOKEN}@github.com/betsyflickinger-max/price-dashboard-data.git" board-status

name: Board status (every 15 min)

on:
  workflow_run:   # GitHub's hourly schedule can lag or skip, so also refresh after each bot run
    workflows: ["Insurer price files", "Hospital price files"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min (free on a public repo); the Claude board update runs at :29 or when Betsy presses Refresh
  workflow_dispatch:

concurrency:
  group: board-status
  cancel-in-progress: false   # Oct 13: runs take >10 min now; cancelling meant no run ever finished

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # Oct 16: status.py now takes ~25 min (more areas); at 25 most runs hit the limit and the board went stale
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3==1.35.36
      - run: python board/status.py
      - name: Bot health data for the dashboard (ops_*.json, private copy only)
        continue-on-error: true   # a problem here must never stop the status snapshot
        run: python board/ops.py
      - name: Visitors tab data (preview testers' page views; private copy only)
        continue-on-error: true
        run: python board/visitors.py
      - name: Copy bot health + visitors files to R2 for the private control center (files.healthcare/control)
        continue-on-error: true
        run: python board/to_r2_control.py out/board 'ops_*.json' 'visitors_*.json'
      - name: Publish to the private repo (branch board-status)
        env:
          DATA_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          [ -n "$DATA_TOKEN" ] || { echo "::error::DASHBOARD_DATA_TOKEN is not set"; exit 1; }
          cd out/board
          git init -q -b board-status
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Board status $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${DATA_TOKEN}@github.com/betsyflickinger-max/price-dashboard-data.git" board-status
      - name: Public copy for the board's update task (this repo, branch board-status)
        # Betsy OK'd posting these status numbers publicly (Oct 11, 2026) so the board's Claude task can read them.
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          cp "$GITHUB_WORKSPACE/out/board/status.json" .
          git init -q -b board-status
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Board status $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" board-status
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete board-enc 2>/dev/null || true

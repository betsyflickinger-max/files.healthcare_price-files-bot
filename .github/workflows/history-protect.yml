name: Keep price history

# Nov 6, 2026 (Betsy: keep past data for change over time): copies replaced insurer tables out of work/retired/ (60-day storage
# cleanup) into history/insurers/<month>/work-retired/ (kept permanently). Copies only, never deletes. Monthly and by hand.

on:
  push:
    branches: [audit, main]
    paths: [site/history_protect.py, .github/workflows/history-protect.yml]
  schedule:
    - cron: "41 10 1 * *"
  workflow_dispatch:

concurrency:
  group: history-protect
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 pillow==10.4.0 pyarrow==26.0.0
      - run: python -u site/history_protect.py | tee -a "$GITHUB_STEP_SUMMARY"

name: Plan Calculator rate file (add networks)

# Oct 30, 2026: runs calculator/exchange_rates.py on its own (dry run shows what it would add, and why a table adds nothing).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be added"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas==2.2.3 pyarrow==26.0.0
      - run: python calculator/exchange_rates.py ${{ inputs.dry_run && '--dry-run' || '' }}

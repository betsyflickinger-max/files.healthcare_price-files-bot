name: Merge new networks into a state build (free GitHub machine)

# Oct 18, 2026: update mode's merge step (site/merge_build.py), started by site/orchestrate_states.py. It only streams
# files between R2 folders, so a free GitHub machine is enough; a rented machine is used only if this fails twice.

on:
  workflow_dispatch:
    inputs:
      base: {description: "finished build, e.g. site/every-st/colorado/2026-10/", required: true}
      add: {description: "add-only build, e.g. site/every-st-add/colorado/2026-10c/", required: true}
      out: {description: "new build, e.g. site/every-st/colorado/2026-10c/", required: true}

permissions:
  contents: read

concurrency:
  group: merge-${{ inputs.out }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BASE: ${{ inputs.base }}
      ADD: ${{ inputs.add }}
      OUT: ${{ inputs.out }}
      PROCS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - run: python site/merge_build_test.py
      - run: python site/merge_build.py

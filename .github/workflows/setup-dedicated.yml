name: Set up an always-on server

# Oct 18, 2026 (Betsy: monthly servers instead of hourly machines). Run by hand once per new server (Hetzner AX102 or
# similar, Ubuntu 24.04, ordered with the bot's SSH key, whose private half is in R2 bot/secrets/hetzner_ssh_key).
# It installs dedicated/setup.sh over SSH: one queue worker per slot, kept running and up to date by systemd.
# Running it again on the same server updates it in place.

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "Server IP address (from Hetzner's ready email)"
        required: true
      name:
        description: "Short name for the server (hz1, hz2, ...)"
        required: true
        default: "hz1"
      slots:
        description: "Memory (GB) per worker; AX102 has 128 GB"
        default: "32 32 16 16"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q boto3==1.35.36
      - name: Get the server key
        run: |
          python - <<'EOF'
          import os, boto3
          g = lambda k: "".join(os.environ[k].split())
          s3 = boto3.client("s3", endpoint_url=(os.environ.get("STORAGE_ENDPOINT") or f"https://{g('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com"),
                            aws_access_key_id=g("R2_ACCESS_KEY_ID"), aws_secret_access_key=g("R2_SECRET_ACCESS_KEY"), region_name=(os.environ.get("STORAGE_REGION") or "auto"))
          os.makedirs(os.path.expanduser("~/.ssh"), exist_ok=True)
          p = os.path.expanduser("~/.ssh/hz")
          open(p, "wb").write(s3.get_object(Bucket=g("R2_BUCKET"), Key="bot/secrets/hetzner_ssh_key")["Body"].read())
          os.chmod(p, 0o600)
          EOF
      - name: Install the workers
        run: |
          strip() { echo -n "$1" | tr -d '[:space:]'; }
          IP="${{ inputs.ip }}"; NAME="${{ inputs.name }}"; SLOTS="${{ inputs.slots }}"
          SSH="ssh -i $HOME/.ssh/hz -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@$IP"
          scp -i $HOME/.ssh/hz -o StrictHostKeyChecking=accept-new dedicated/setup.sh root@$IP:/root/setup.sh
          $SSH "R2_ACCOUNT_ID='$(strip "$R2_ACCOUNT_ID")' R2_ACCESS_KEY_ID='$(strip "$R2_ACCESS_KEY_ID")' \
                R2_SECRET_ACCESS_KEY='$(strip "$R2_SECRET_ACCESS_KEY")' R2_BUCKET='$(strip "$R2_BUCKET")' STORAGE_ENDPOINT='$(strip "$STORAGE_ENDPOINT")' STORAGE_REGION='$(strip "$STORAGE_REGION")' \
                DIGITALOCEAN_TOKEN='$(strip "$DIGITALOCEAN_TOKEN")' BOT_GITHUB_TOKEN='$(strip "$BOT_GITHUB_TOKEN")' \
                IA_ACCESS_KEY='$(strip "$IA_ACCESS_KEY")' IA_SECRET_KEY='$(strip "$IA_SECRET_KEY")' \
                SERVER='$NAME' SLOTS='$SLOTS' bash /root/setup.sh"

name: Dashboard data (hospital and price sides)

# Builds the hospital-side files (dashboard/build.py) and, since Oct 13, 2026, the price-side files for every live Price Finder
# area (dashboard/build_prices.py; it used to run on Betsy's Mac). Builds the hospital-side files for Betsy's "Price Transparency Metrics" dashboard from the bot's
# latest checks, then force-pushes them (one commit, no history) to the private repo
# betsyflickinger-max/price-dashboard-data when the DASHBOARD_DATA_TOKEN secret is set, else to this repo's
# public dashboard-data branch.
# A daily Claude scheduled task picks them up from that branch and uploads changed files to the dashboard.
on:
  workflow_run:
    workflows: ["Hospital price files"]
    types: [completed]
  schedule:
    - cron: "40 16 * * *"   # fallback, 11:40am Central
  workflow_dispatch:

concurrency:
  group: dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3==1.35.36
      - run: python dashboard/build.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("out/dashboard/states.json")); h = json.load(open("out/dashboard/hospitals.json"))
          assert len(s) == 51, len(s)
          assert len(h) > 4000, len(h)
          assert sum(x["have"] for x in s) > 0
          print("ok", len(h), "hospitals")
          PY
      - name: Price side (every live Price Finder area)
        # a failure here leaves the hospital side to publish as before; the price files are then simply missing for the day
        continue-on-error: true
        run: |
          set -o pipefail
          python dashboard/build_prices.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, glob, os
          m = json.load(open("out/dashboard/markets.json")); assert any(x["market"] == "DFW" for x in m), "no DFW"
          for f in sorted(glob.glob("out/dashboard/*.json")): assert os.path.getsize(f) < 8_000_000, f"{f} is over 8 MB"
          print("price side ok:", len(m), "areas")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: out/dashboard
          retention-days: 2

  network:   # Oct 15, 2026: the "Network access" tab for every live area (was run by hand for DFW + 5 Texas markets)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3==1.35.36 numpy==2.1.2
      - name: Network access (every live Price Finder area)
        run: |
          set -o pipefail
          python dashboard/build_network.py --out out/network | grep -vE '_[0-9]+\.json 0 rows' | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, glob, os
          a = json.load(open("out/network/net_access.json")); assert any(x["market"] == "DFW" for x in a), "no DFW"
          for f in sorted(glob.glob("out/network/*.json")): assert os.path.getsize(f) < 8_000_000, f"{f} is over 8 MB"
          print("network side ok:", len({x["market"] for x in a}), "areas")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: network
          path: out/network
          retention-days: 2

  publish:   # runs once both are done; if the network job failed, the day's data goes out without its files (yesterday's stay)
    needs: [build, network]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: out/dashboard
      - uses: actions/download-artifact@v4
        if: needs.network.result == 'success'
        with:
          name: network
          path: out/dashboard
      - name: Publish (private repo when its token is set, else the public dashboard-data branch)
        env:
          DATA_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          cd out/dashboard
          printf '%s\n' "Hospital-side data for the Price Transparency Metrics dashboard, built $(date -u +%FT%TZ) by .github/workflows/dashboard.yml in price-files-bot." > README.md
          git init -q -b main
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Dashboard data $(date -u +%F)"
          if [ -n "$DATA_TOKEN" ]; then
            # private copy: betsyflickinger-max/price-dashboard-data (one commit, replaced daily)
            git push -f "https://x-access-token:${DATA_TOKEN}@github.com/betsyflickinger-max/price-dashboard-data.git" main
            # remove the old public copy if it is still there
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete dashboard-data 2>/dev/null || true
            echo "Published to the private repo." >> "$GITHUB_STEP_SUMMARY"
          else
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main:dashboard-data
            echo "::warning::DASHBOARD_DATA_TOKEN is not set, so the data went to the PUBLIC dashboard-data branch."
          fi

name: Show a site page (read-only)

# Oct 30, 2026: prints one page of the live preview site with any large JSON data blocks shortened, so its code can be
# read before an edit. Changes nothing.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "File inside the site, e.g. site/plan-calculator/index.html"
        default: "site/plan-calculator/index.html"

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - env:
          P: ${{ inputs.path }}
        run: |
          python site/site_files.py pull w > /dev/null
          python - <<'PY'
          import os, re
          s = open(os.path.join("w", os.environ["P"]), encoding="utf-8").read()
          s = re.sub(r'(<script type="application/json"[^>]*>)(.{300})(.*?)(</script>)',
                     lambda m: f"{m.group(1)}{m.group(2)}…[{len(m.group(3)):,} chars]{m.group(4)}", s, flags=re.S)
          print(f"=== {os.environ['P']} ({len(s):,} chars after shortening)")
          print(s)
          PY

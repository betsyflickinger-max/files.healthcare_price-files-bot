name: Build check (read-only)

# Oct 16, 2026: prints a state build's progress from R2 (state, stage A/B counts, each machine's log). Changes nothing.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build id, e.g. stnc-2026-10 or st-2026-10b"
        default: "stnc-2026-10"
      state:
        description: "State folder, e.g. north-carolina"
        default: "north-carolina"
      lines:
        description: "Log lines per machine"
        default: "15"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - run: python site/build_check.py "${{ inputs.build }}" "${{ inputs.state }}" "${{ inputs.lines }}" | tee -a "$GITHUB_STEP_SUMMARY"

name: Requested codes (common codes first)

# Oct 18, 2026 (Betsy approved "common codes first"): a visitor who picks a code that isn't built yet sees "We're
# pulling these prices now, check back in a few minutes"; the page's function writes R2 requests/<area>/<code>.json and can
# start this right away (repository_dispatch, type price-request). The 10-minute schedule catches anything missed.
# site/request_codes.py builds just those codes into the area's finished build (free GitHub machine; the repo is public).

on:
  schedule:
    - cron: "*/10 * * * *"
  repository_dispatch:
    types: [price-request]
  workflow_dispatch:

concurrency:
  group: request-codes   # one at a time: each run edits builds' embed.json
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      REQ_WORK: /home/runner/reqwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the same DuckDB as the page-build machines (its hash() places codes in buckets; it must match stage A)
      - run: pip install -q duckdb==1.1.3 boto3==1.35.36
      - name: Waiting requests
        id: n
        run: |
          python site/request_codes.py --list | tee /tmp/list.txt
          head -1 /tmp/list.txt | grep -q " 0 requests waiting" && echo "none=1" >> "$GITHUB_OUTPUT" || true
      - name: Build requested codes
        if: steps.n.outputs.none != '1'
        run: python site/request_codes.py

name: Small insurer files (free GitHub machines)

# Oct 18, 2026 (Betsy OK'd): small insurer files (jobs that fit 8 GB) are read here for free, since the repo is public.
# Same shared queue (bot/fleet/queue/) and same worker as the rented DigitalOcean machines (insurers/worker.py with
# GHA_WORKER=1). The launcher leaves small files to this lane for 90 minutes after they're queued (fleet.GHA_GRACE_MIN),
# then rents a machine if they're still waiting. A file too big for a GitHub machine goes back in line for a rented one.
# Kept small on purpose: GitHub expects Actions to serve the project, not to be a free compute farm.
# Oct 24, 2026 (Betsy OK'd): 4 -> 6 machines to speed up the Northeast and West small files. Watch that fills and page
# builds still start on time (GitHub runs at most 20 jobs at once for the whole account); go back to 4 if they queue.

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      n: ${{ steps.count.outputs.n }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - id: count
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, sys
          sys.path.insert(0, "insurers")
          import boto3, fleet
          g = lambda k: "".join(os.environ[k].split())   # secrets can carry stray spaces/line breaks
          s3 = boto3.client("s3", endpoint_url=(os.environ.get("STORAGE_ENDPOINT") or f"https://{g('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com"),
                            aws_access_key_id=g("R2_ACCESS_KEY_ID"), aws_secret_access_key=g("R2_SECRET_ACCESS_KEY"),
                            region_name=(os.environ.get("STORAGE_REGION") or "auto"))
          b = g("R2_BUCKET")
          js, cl = fleet.jobs(s3, b), fleet.claims(s3, b)
          n = sum(1 for jid, j in js.items() if jid not in cl and j.get("kind", "insurer") == "insurer"
                  and j.get("mem", 8) <= fleet.GHA_MAX_MEM and not j.get("nogha"))
          print(f"n={n}")
          print(f"small files waiting: {n}", file=sys.stderr)
          EOF

  work:
    needs: check
    if: needs.check.outputs.n != '0'
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3, 4, 5, 6]
    concurrency:
      group: gha-fleet-${{ matrix.i }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      GHA_WORKER: "1"
      GHA_INDEX: ${{ matrix.i }}
      WORKER_MEM: "8"
      NO_SELF_DELETE: "1"
      MAX_CLAIM_MINUTES: "240"   # stop taking new files after 4 hours; GitHub ends a job at 6
      RUN_ID: ""
      GROUP: ""
    steps:
      - name: Make disk room (about 30 GB more)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: actions/checkout@v4
      - name: Go reader (mrfrows)
        run: |
          curl -sL https://go.dev/dl/go1.26.9.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
          export PATH=$PATH:/usr/local/go/bin
          cd insurers/pipeline/mrfrows && go build -o mrfrows .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r insurers/requirements-worker.txt -r requirements.txt
      - name: Read small files from the shared queue
        run: python insurers/worker.py

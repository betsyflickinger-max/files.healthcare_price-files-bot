name: State Price Finder pages (shared)

# Oct 18, 2026: ONE schedule for every state on site/state_scopes.json (Illinois first), instead of a copy per state
# (nc-pages.yml, ct-pages.yml). Same steps as those: site/orchestrate_states.py with ST_SCOPE=<scope> moves the insurer
# build one step per pass (it waits until the state's insurer files are read, and the price check and machine shares
# apply), then site/hosp_area.py with HOSP_SCOPE=<scope> adds hospital files and publishes the page. Hourly, and by hand.

on:
  schedule:
    - cron: "36 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Start even if the state's insurer files are still being read"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write   # to start the next run itself when this one runs out of time

jobs:
  scopes:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "list=$(python3 -c "import json;print(json.dumps([k for k in json.load(open('site/state_scopes.json')) if not k.startswith('_')]))")" >> "$GITHUB_OUTPUT"

  insurers:
    needs: scopes
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.scopes.outputs.list) }}
    concurrency:
      group: state-build-${{ matrix.scope }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '1' || '' }}
      ST_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - name: Insurer part
        run: |
          [ -z "$FORCE" ] && unset FORCE
          for i in $(seq 1 64); do
            git pull -q --ff-only origin main || true
            python site/orchestrate_states.py | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(python site/build_stage.py site/builds/st${ST_SCOPE}-$(date +%Y-%m)/state.json)" = hosp ]; then exit 0; fi
            [ -f /tmp/st_waiting ] && exit 0   # still reading the state's insurer files: the next hourly run checks again
            sleep 300
          done
          gh workflow run state-builds.yml --ref main

  pages:
    needs: scopes
    strategy:
      fail-fast: false
      max-parallel: 1   # publishing deploys the site, so one state at a time
      matrix:
        scope: ${{ fromJSON(needs.scopes.outputs.list) }}
    concurrency:
      group: site-build-v2   # the website build's shared lock
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HOSP_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - name: Hospitals and pages
        run: |
          # nothing to publish until the state's insurer build exists
          python - <<'PY' || exit 0
          import os, sys, json, boto3, time
          g = lambda k: "".join(os.environ[k].split())
          s3 = boto3.client("s3", endpoint_url=(os.environ.get("STORAGE_ENDPOINT") or f"https://{g('R2_ACCOUNT_ID')}.r2.cloudflarestorage.com"), aws_access_key_id=g("R2_ACCESS_KEY_ID"),
                            aws_secret_access_key=g("R2_SECRET_ACCESS_KEY"), region_name=(os.environ.get("STORAGE_REGION") or "auto"))
          k = f"site/builds/st{os.environ['HOSP_SCOPE']}-{time.strftime('%Y-%m')}/state.json"
          try: st = json.loads(s3.get_object(Bucket=g("R2_BUCKET"), Key=k)["Body"].read())
          except Exception: print("no insurer build yet for", os.environ["HOSP_SCOPE"]); sys.exit(1)
          print("insurer build stage:", st.get("stage"))
          sys.exit(0 if st.get("stage") in ("build", "hosp") else 1)
          PY
          for i in $(seq 1 100); do
            python site/hosp_area.py run | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$(python site/build_stage.py site/builds/hosp-st${HOSP_SCOPE}-$(date +%Y-%m)/state.json)" = done ] && exit 0
            [ -f /tmp/hosp_idle ] && exit 0
            sleep 180
          done
          gh workflow run state-builds.yml --ref main

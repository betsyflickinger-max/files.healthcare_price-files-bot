name: Employer plans (catalogs + Form 5500)

# Oct 16, 2026: joins every employer plan the insurer catalogs list (by EIN) to the employer's Form 5500 health-plan filing
# (U.S. Department of Labor): name, address, industry, participants, how the plan is funded, Schedule A insurers.
# insurers/employers.py; output R2 bot/employers/<date>/ (report in the run summary). Runs on this free runner.

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "all (Form 5500 then join), f5500, or join"
        default: "all"
      years:
        description: "Form 5500 data years"
        default: "2024,2025"

permissions:
  contents: read

jobs:
  employers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      WORK: /tmp/employers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 ijson==3.3.0
      - if: ${{ inputs.cmd == 'all' || inputs.cmd == 'f5500' }}
        run: python insurers/employers.py f5500 --years "${{ inputs.years }}"
      - if: ${{ inputs.cmd == 'all' || inputs.cmd == 'join' }}
        run: python insurers/employers.py join

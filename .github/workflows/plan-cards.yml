name: Project plan cards (control center)
# Nov 2, 2026 (Betsy): lets any chat read and update the control center's Project plan tab (R2 control/plan.json).
# show: prints every card by lane in the run summary (and as the "plan" download).
# apply: adds/updates the cards in control/plan_updates.json (matched by id; never deletes). See board/plan_cards.py.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "show or apply"
        default: "show"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SITE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}   # Nov 9: the plan stays on R2 (the control center edits it there)
      SITE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SITE_R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36
      - run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then python board/plan_cards.py apply control/plan_updates.json
          else python board/plan_cards.py show; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out/plan.json

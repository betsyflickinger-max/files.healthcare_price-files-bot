name: Check what's live (reads the deployed bundle)

# Oct 31, 2026: the live site is password-protected, so this reads site/deploy/current.tgz and prints what card #2 put on the pages.
on:
  push:
    branches: [main]
    paths: [site/check_live.py, .github/workflows/check-live.yml]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 pillow==10.4.0 pyarrow==26.0.0
      - run: python site/check_live.py | tee -a "$GITHUB_STEP_SUMMARY"

name: Private price vs Medicare (research, reads big tables)

# Nov 10, 2026: private negotiated rates as a multiple of Medicare, by kind of care, for one state or all states
# (analysis/medicare_multiple/, method docs/medicare-multiple.md). Report: reports/medicare-multiple/<state>/.
# Three steps, each started by hand:
#   estimate   lists the tables and prints the cost. Reads only file footers. Rents nothing.
#   start      estimate again; if it is at or under the limit ($40, or build_approvals.json "mm-<state>"), builds the Medicare
#              benchmark from CMS's public files, rents up to 4 DigitalOcean machines for the biggest tables (they delete
#              themselves when done; Betsy's monthly card cap is checked first) and reads the rest on GitHub's free machines.
#   summarize  when every table is done ("status" shows it), writes the report and commits it to this branch.
# It never writes to the site and never deletes anything.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "estimate, start, status or summarize"
        default: "estimate"
      state:
        description: "Two-letter state code(s), comma separated, or ALL"
        default: "TX"
      run:
        description: "Run id (blank = <state>-<yyyy-mm>)"
        default: ""
      machines:
        description: "Most rented machines at once (start)"
        default: "4"
      gh_max_rows:
        description: "Tables up to this many rows read on GitHub's free machines (estimate/start; use 0 for ALL)"
        default: "800000000"

permissions:
  contents: write

concurrency:
  group: medicare-multiple-${{ inputs.state }}
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
  STORAGE_REGION: ${{ vars.STORAGE_REGION }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  RUN_ARG: ${{ inputs.run != '' && format('--run {0}', inputs.run) || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6 requests==2.33.0
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - name: ${{ inputs.step }}
        run: |
          case "${{ inputs.step }}" in
            estimate|start|status) python analysis/medicare_multiple/run.py "${{ inputs.step }}" --state "${{ inputs.state }}" $RUN_ARG \
                                     --ref "${GITHUB_REF_NAME}" --machines "${{ inputs.machines }}" --gh-max-rows "${{ inputs.gh_max_rows }}" --work /mnt/mm/work --cache /mnt/mm/cms --bench /mnt/mm/bench | tee -a "$GITHUB_STEP_SUMMARY" ;;
            summarize) echo "summarize runs in its own job" ;;
            *) echo "step must be estimate, start, status or summarize"; exit 1 ;;
          esac

  read-on-github:
    # the smaller tables, hospital files and out-of-network files, on GitHub's free machines (4 at a time, so the insurer
    # reader's own GitHub lane keeps its machines)
    needs: prepare
    if: ${{ inputs.step == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - run: python analysis/medicare_multiple/run.py reduce --state "${{ inputs.state }}" $RUN_ARG --lane gh --shard ${{ matrix.shard }} --shards 8 --from-storage --work /mnt/mm/work --bench /mnt/mm/bench

  summarize:
    if: ${{ inputs.step == 'summarize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - run: python analysis/medicare_multiple/run.py summarize --state "${{ inputs.state }}" $RUN_ARG --work /mnt/mm/work --bench /mnt/mm/bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/medicare-multiple 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Private price vs Medicare report ${{ inputs.state }} $(date -u +%F)"; git pull -q --rebase origin "${GITHUB_REF_NAME}"; git push -q origin HEAD:"${GITHUB_REF_NAME}"; }

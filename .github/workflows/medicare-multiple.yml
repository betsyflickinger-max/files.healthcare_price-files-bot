name: Private price vs Medicare (research, reads big tables)

# Nov 10, 2026: private negotiated rates as a multiple of Medicare, by kind of care, for one state or all states
# (analysis/medicare_multiple/, method docs/medicare-multiple.md). Report: reports/medicare-multiple/<state>/.
# Three steps, each started by hand:
#   estimate   lists the tables and prints the cost. Reads only file footers. Rents nothing.
#   start      estimate again; if it is at or under the limit ($40, or build_approvals.json "mm-<state>"), builds the Medicare
#              benchmark from CMS's public files, rents up to 4 DigitalOcean machines for the biggest tables (they delete
#              themselves when done; Betsy's monthly card cap is checked first) and reads the rest on GitHub's free machines.
#              Nov 10: with no free machine slot (2 are always kept for other builds) it waits up to "wait_minutes", then
#              leaves the run queued; "start_after" (HH:MM Central) waits for that time, or queues it if it is further away.
#   resume     runs every night by itself: starts the oldest queued run whose time has come (same $40 check first).
#   add        (Nov 13) while the rented machines are reading: rents up to (machines - already rented) more, each reading one
#              busy machine's list from the smallest table backward, so the two meet in the middle. Same $ estimate, same
#              2 reserved slots and card cap; waits up to wait_minutes for free slots, then gives up. Once per run.
#   summarize  when every table is done ("status" shows it), writes the report and commits it to this branch.
# It never writes to the site and never deletes anything.
on:
  schedule:
    - cron: "17 8 * * *"      # 2:17 am Central (3:17 in summer): step "resume"; does nothing when no run is queued
  workflow_dispatch:
    inputs:
      step:
        description: "estimate, start, resume, add, status or summarize"
        default: "estimate"
      state:
        description: "Two-letter state code(s), comma separated, or ALL"
        default: "TX"
      run:
        description: "Run id (blank = <state>-<yyyy-mm>)"
        default: ""
      machines:
        description: "Most rented machines at once (start)"
        default: "4"
      gh_max_rows:
        description: "Tables up to this many rows read on GitHub's free machines (estimate/start; use 0 for ALL)"
        default: "800000000"
      start_after:
        description: "start: wait until this time, HH:MM Central (blank = now). Further away than wait_minutes = queued for the nightly run"
        default: ""
      wait_minutes:
        description: "start/resume: minutes to wait in this job for the start time or for free machine slots before queuing"
        default: "240"

permissions:
  contents: write

concurrency:
  # 'add' and 'status' get their own groups: it must not wait behind the run whose machines it helps (Nov 13)
  group: medicare-multiple-${{ (inputs.step == 'add' || inputs.step == 'status') && format('{0}-', inputs.step) || '' }}${{ inputs.state || 'nightly' }}
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
  STORAGE_REGION: ${{ vars.STORAGE_REGION }}
  R2_ACCESS_KEY_ID: ${{ vars.STORAGE_ENDPOINT && secrets.B2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ vars.STORAGE_ENDPOINT && secrets.B2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.STORAGE_ENDPOINT && secrets.B2_BUCKET || secrets.R2_BUCKET }}
  RUN_ARG: ${{ inputs.run != '' && format('--run {0}', inputs.run) || '' }}
  STEP: ${{ inputs.step || 'resume' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # start/resume may wait for free machine slots (wait_minutes) before queuing
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    outputs:                    # set by run.py: whether the free GitHub lane should read now, and which run
      gh_go: ${{ steps.go.outputs.gh_go }}
      state: ${{ steps.go.outputs.state }}
      run: ${{ steps.go.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6 requests==2.33.0
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - name: ${{ env.STEP }}
        id: go
        run: |
          set -o pipefail
          case "$STEP" in
            estimate|start|status|add) python analysis/medicare_multiple/run.py "$STEP" --state "${{ inputs.state }}" $RUN_ARG \
                                     --ref "${GITHUB_REF_NAME}" --machines "${{ inputs.machines }}" --gh-max-rows "${{ inputs.gh_max_rows }}" \
                                     --start-after "${{ inputs.start_after }}" --wait-minutes "${{ inputs.wait_minutes }}" \
                                     --work /mnt/mm/work --cache /mnt/mm/cms --bench /mnt/mm/bench | tee -a "$GITHUB_STEP_SUMMARY" ;;
            resume) python analysis/medicare_multiple/run.py resume --wait-minutes "${{ inputs.wait_minutes || '240' }}" \
                                     --work /mnt/mm/work --cache /mnt/mm/cms --bench /mnt/mm/bench | tee -a "$GITHUB_STEP_SUMMARY" ;;
            summarize) echo "summarize runs in its own job" ;;
            *) echo "step must be estimate, start, resume, add, status or summarize"; exit 1 ;;
          esac

  read-on-github:
    # the smaller tables, hospital files and out-of-network files, on GitHub's free machines (4 at a time, so the insurer
    # reader's own GitHub lane keeps its machines). Runs once per run id, as soon as start/resume has put the benchmark in
    # storage, even while the rented machines are still queued.
    needs: prepare
    if: ${{ needs.prepare.outputs.gh_go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - run: python analysis/medicare_multiple/run.py reduce --state "${{ needs.prepare.outputs.state }}" --run "${{ needs.prepare.outputs.run }}" --lane gh --shard ${{ matrix.shard }} --shards 8 --from-storage --work /mnt/mm/work --bench /mnt/mm/bench

  summarize:
    if: ${{ inputs.step == 'summarize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 duckdb==1.5.6
      - run: sudo mkdir -p /mnt/mm && sudo chown $USER /mnt/mm
      - run: python analysis/medicare_multiple/run.py summarize --state "${{ inputs.state }}" $RUN_ARG --work /mnt/mm/work --bench /mnt/mm/bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        run: |
          git config user.name "price-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/medicare-multiple 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Private price vs Medicare report ${{ inputs.state }} $(date -u +%F)"; git pull -q --rebase origin "${GITHUB_REF_NAME}"; git push -q origin HEAD:"${GITHUB_REF_NAME}"; }

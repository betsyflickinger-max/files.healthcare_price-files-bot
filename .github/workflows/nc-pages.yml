name: North Carolina Price Finder page

# North Carolina's Price Finder page (Oct 16, 2026), built exactly like the seven state pages (state-pages.yml) but from its
# own insurer tables (data/nc/): site/orchestrate_states.py with ST_SCOPE=nc, then site/hosp_area.py with HOSP_SCOPE=nc.
# Every run moves the build one step. Hourly, and by hand.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Start even if North Carolina insurer files are still being read"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write   # to start the next run itself when this one runs out of time

jobs:
  insurers:   # split + build on rented machines: no website deploys, so it doesn't wait for the site-build lock
    concurrency:
      group: nc-state-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ins.outputs.ready }}
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '1' || '' }}
      ST_SCOPE: nc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - name: Insurer part
        id: ins
        run: |
          [ -z "$FORCE" ] && unset FORCE
          # keep moving the build forward every 5 minutes (GitHub's schedule doesn't fire reliably), until the insurer part is done
          for i in $(seq 1 64); do
            git pull -q --ff-only origin main || true   # Oct 14: pick up code fixes within 5 min, not at the next fresh run
            python site/orchestrate_states.py | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(python site/build_stage.py site/builds/stnc-$(date +%Y-%m)/state.json)" = hosp ]; then echo "ready=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 300
          done
          gh workflow run nc-pages.yml --ref main   # out of time: hand over to a fresh run
  pages:   # hospitals + publishing deploys the site, so it shares the website build's lock
    # Oct 15 (Betsy): runs beside the insurer builds, not after all of them: each state's page goes live as soon as that
    # state is built. Stops when nothing is left to do for now (/tmp/hosp_idle), so it never holds the lock while waiting.
    concurrency:
      group: site-build-v2   # Oct 18: old name stuck; every queued run sat pending and got replaced
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force && '1' || '' }}
      ST_SCOPE: nc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 duckdb==1.1.3 requests==2.32.3 rapidfuzz==3.10.0
      - name: Hospitals and pages
        run: |
          for i in $(seq 1 100); do
            HOSP_SCOPE=nc python site/hosp_area.py run | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$(python site/build_stage.py site/builds/hosp-stnc-$(date +%Y-%m)/state.json)" = done ] && exit 0
            [ -f /tmp/hosp_idle ] && exit 0   # waiting on a state's insurer build; the next hourly run picks it up
            sleep 180
          done
          gh workflow run nc-pages.yml --ref main

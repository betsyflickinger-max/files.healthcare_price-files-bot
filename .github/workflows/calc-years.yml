name: Plan Calculator plan-year switch (2027 / 2026)

# Oct 30, 2026: puts calculator/data/2027/calc_data_2027.json on the Plan Calculator page next to the 2026 data, with a
# "Which plan year?" choice (2027 first). Re-running refreshes the 2027 data only.
on:
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install boto3==1.35.36 pillow==10.4.0 pyarrow==26.0.0
      - run: |
          python site/site_files.py pull w
          python site/calc_years.py w calculator/data/2027/calc_data_2027.json
          python site/site_files.py push w

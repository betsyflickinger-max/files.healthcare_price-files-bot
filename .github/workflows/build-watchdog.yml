name: Stuck-build watchdog (every 15 min)
# Nov 3, 2026 (Betsy OK'd): every state page build, once an hour, from outside. A build with machines billing and nothing
# saved in 3 hours gets ONE issue (an email) and is cut to 2 machines until it moves again; a build waiting 12+ hours gets
# one issue; a daily summary comment ~7 AM CT. See board/build_watchdog.py.
on:
  schedule:
    - cron: "5,20,35,50 * * * *"   # Nov 8, 2026: every 15 minutes (was hourly)
  workflow_dispatch:
    inputs:
      dry:
        description: "Only print what it would do"
        type: boolean
        default: false
      digest_now:
        description: "Post the daily summary now"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: build-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY: ${{ inputs.dry && '1' || '' }}
      DIGEST_NOW: ${{ inputs.digest_now && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q boto3 requests
      - run: python board/build_watchdog.py

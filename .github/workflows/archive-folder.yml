name: Save an insurer folder

# Saves every file in an insurer's open web folder to R2 (compressed, with a manifest) so the data is kept even before
# the bot reads it. Run by hand. A rerun on the same day resumes. See insurers/archive_folder.py.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Folder link"
        default: "https://www.coxhealthplans.com/MRF/"
      name:
        description: "Short name (R2 raw/insurers/<name>/<date>/)"
        default: "cox"

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.35.36 requests==2.32.3 zstandard==0.23.0
      - run: python insurers/archive_folder.py "${{ inputs.url }}" "${{ inputs.name }}"
